<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用户反馈</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 24px 0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .header p {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }

    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .form-label .required {
      color: #ff4d4f;
      margin-left: 2px;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .radio-item {
      flex: 1;
      min-width: calc(50% - 5px);
    }

    .radio-item input[type="radio"] {
      display: none;
    }

    .radio-item label {
      display: block;
      padding: 12px 16px;
      text-align: center;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-item input[type="radio"]:checked + label {
      background: #e6f4ff;
      border-color: #1677ff;
      color: #1677ff;
    }

    .radio-item label:active {
      transform: scale(0.98);
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 15px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #1677ff;
    }

    textarea::placeholder {
      color: #bfbfbf;
    }

    .textarea-wrapper {
      position: relative;
    }

    .image-upload-hint {
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 12px;
      color: #999;
      pointer-events: none;
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    /* 图片上传区域 */
    .image-upload-area {
      margin-top: 12px;
    }

    .upload-btn-wrapper {
      display: inline-block;
    }

    .upload-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #f5f5f5;
      border: 1px dashed #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-btn:hover {
      border-color: #1677ff;
      color: #1677ff;
    }

    .upload-icon {
      font-size: 16px;
    }

    .image-preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .image-preview-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }

    .image-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-preview-item .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-preview-item .remove-btn:hover {
      background: rgba(255, 77, 79, 0.8);
    }

    .char-count.warning {
      color: #ff4d4f;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #1677ff;
    }

    input[type="text"]::placeholder {
      color: #bfbfbf;
    }

    .submit-btn {
      width: 100%;
      padding: 14px 24px;
      background: #1677ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .submit-btn:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }

    .submit-btn:not(:disabled):active {
      transform: scale(0.98);
    }

    .submit-btn.loading {
      position: relative;
      color: transparent;
    }

    .submit-btn.loading::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      top: 50%;
      left: 50%;
      margin-left: -9px;
      margin-top: -9px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
    }

    .toast.success {
      background: rgba(82, 196, 26, 0.95);
    }

    .toast.error {
      background: rgba(255, 77, 79, 0.95);
    }

    /* 登录页面样式 */
    .login-content {
      text-align: center;
      padding: 40px 20px;
    }

    .login-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .login-title {
      margin: 0 0 12px;
      color: #1a1a1a;
      font-size: 20px;
    }

    .login-desc {
      color: #666;
      margin: 0 0 30px;
      font-size: 14px;
    }

    .user-info {
      margin-bottom: 16px;
      padding: 12px;
      background: #f0f7ff;
      border-radius: 8px;
      font-size: 14px;
      color: #1677ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-btn {
      font-size: 12px;
      color: #666;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Mobile optimization */
    @media (max-width: 375px) {
      .container {
        padding: 12px;
      }

      .form-card {
        padding: 16px;
      }

      .radio-item label {
        padding: 10px 12px;
        font-size: 13px;
      }
    }

    /* Safe area for iPhone X+ */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .container {
        padding-bottom: calc(16px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>用户反馈</h1>
      <p>您的建议是我们改进的动力</p>
    </div>

    <!-- 登录页面 -->
    <div id="loginPage" class="form-card" style="display: none;">
      <div class="login-content">
        <div class="login-icon">🔐</div>
        <h2 class="login-title">正在跳转到飞书登录...</h2>
        <p class="login-desc">请在飞书中完成授权</p>
        <button id="loginBtn" class="submit-btn" style="margin-top: 0; display: none;">
          使用飞书登录
        </button>
      </div>
    </div>

    <!-- 反馈表单 -->
    <div id="formPage" class="form-card" style="display: none;">
      <div id="userInfo" class="user-info">
        <div class="user-profile">
          <img id="userAvatar" src="" alt="头像" class="user-avatar" style="display: none;">
          <span id="userName">✅ 已登录</span>
        </div>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
      <form id="feedbackForm">
        <!-- 问题类型 -->
        <div class="form-group">
          <label class="form-label">
            问题类型<span class="required">*</span>
          </label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" id="type-crash" name="type" value="崩溃">
              <label for="type-crash">崩溃</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="type-bug" name="type" value="功能异常">
              <label for="type-bug">功能异常</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="type-suggest" name="type" value="体验建议">
              <label for="type-suggest">体验建议</label>
            </div>
            <div class="radio-item">
              <input type="radio" id="type-other" name="type" value="其他">
              <label for="type-other">其他</label>
            </div>
          </div>
        </div>

        <!-- 问题描述 -->
        <div class="form-group">
          <label class="form-label" for="description">
            问题描述<span class="required">*</span>
          </label>
          <div class="textarea-wrapper">
            <textarea
              id="description"
              name="description"
              placeholder="请详细描述您遇到的问题或建议..."
              maxlength="500"
            ></textarea>
            <div class="image-upload-hint">支持粘贴截图或点击下方按钮上传图片</div>
          </div>
          <div class="char-count" id="charCount">0/500</div>

          <!-- 图片上传区域 -->
          <div class="image-upload-area" id="imageUploadArea">
            <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
            <div class="upload-btn-wrapper">
              <button type="button" class="upload-btn" id="uploadBtn">
                <span class="upload-icon">📷</span>
                <span>点击上传图片</span>
              </button>
            </div>
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>
        </div>

        <!-- 联系方式 -->
        <div class="form-group">
          <label class="form-label" for="contact">
            联系方式
          </label>
          <input
            type="text"
            id="contact"
            name="contact"
            placeholder="手机号或微信号"
            maxlength="50"
          >
        </div>

        <!-- 提交按钮 -->
        <button type="submit" class="submit-btn" id="submitBtn" disabled>
          提交反馈
        </button>
      </form>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script>
    // API 配置
    const API_BASE_URL = window.location.origin;

    // DOM 元素
    const loginPage = document.getElementById('loginPage');
    const formPage = document.getElementById('formPage');
    const loginBtn = document.getElementById('loginBtn');
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const description = document.getElementById('description');
    const charCount = document.getElementById('charCount');
    const toast = document.getElementById('toast');
    const typeInputs = document.querySelectorAll('input[name="type"]');
    const imageInput = document.getElementById('imageInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const imagePreviewList = document.getElementById('imagePreviewList');
    const userAvatarEl = document.getElementById('userAvatar');
    const userNameEl = document.getElementById('userName');

    // 图片数组
    let uploadedImages = [];

    // 检查登录状态
    function checkLoginStatus() {
      const openId = localStorage.getItem('feishu_openId');
      const userName = localStorage.getItem('feishu_userName');
      const userAvatar = localStorage.getItem('feishu_userAvatar');

      if (openId) {
        loginPage.style.display = 'none';
        formPage.style.display = 'block';

        // 显示用户信息
        if (userName && userName !== '未知用户') {
          userNameEl.textContent = userName;
        }
        if (userAvatar) {
          userAvatarEl.src = userAvatar;
          userAvatarEl.style.display = 'block';
        }
      } else {
        loginPage.style.display = 'block';
        formPage.style.display = 'none';
        // 自动跳转到飞书登录
        setTimeout(() => {
          login();
        }, 500);
      }
    }

    // 登录
    async function login() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/auth-url`);
        const result = await response.json();
        if (result.success && result.authUrl) {
          window.location.href = result.authUrl;
        } else {
          showToast('获取登录链接失败', 'error');
        }
      } catch (error) {
        console.error('Login error:', error);
        showToast('网络错误，请重试', 'error');
      }
    }

    // 退出登录
    function logout() {
      localStorage.removeItem('feishu_openId');
      localStorage.removeItem('feishu_userName');
      localStorage.removeItem('feishu_userAvatar');
      // 重置用户信息显示
      userNameEl.textContent = '✅ 已登录';
      userAvatarEl.src = '';
      userAvatarEl.style.display = 'none';
      checkLoginStatus();
      showToast('已退出登录', 'success');
    }

    // 更新字数统计
    function updateCharCount() {
      const current = description.value.length;
      charCount.textContent = `${current}/500`;
      if (current >= 450) {
        charCount.classList.add('warning');
      } else {
        charCount.classList.remove('warning');
      }
    }

    // 检查表单是否可提交
    function checkFormValidity() {
      const typeSelected = Array.from(typeInputs).some(input => input.checked);
      const descriptionFilled = description.value.trim().length > 0;
      submitBtn.disabled = !(typeSelected && descriptionFilled);
    }

    // 显示 Toast
    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // 获取设备信息
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let deviceInfo = '未知设备';

      if (/iPhone|iPad|iPod/.test(ua)) {
        deviceInfo = 'iOS ' + (ua.match(/OS (\d+[_\d]+)/)?.[1] || '');
      } else if (/Android/.test(ua)) {
        deviceInfo = 'Android ' + (ua.match(/Android (\d+\.?\d*)/)?.[1] || '');
      }

      return `${deviceInfo} | ${ua.slice(0, 100)}...`;
    }

    // 设置按钮 loading 状态
    function setLoading(loading) {
      if (loading) {
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
      } else {
        submitBtn.classList.remove('loading');
        checkFormValidity();
      }
    }

    // 提交表单
    async function submitForm(e) {
      e.preventDefault();

      if (submitBtn.disabled || submitBtn.classList.contains('loading')) {
        return;
      }

      const openId = localStorage.getItem('feishu_openId');
      if (!openId) {
        showToast('请先登录', 'error');
        checkLoginStatus();
        return;
      }

      setLoading(true);

      const formData = {
        openId: openId,
        type: document.querySelector('input[name="type"]:checked').value,
        description: description.value.trim(),
        contact: document.getElementById('contact').value.trim(),
        deviceInfo: getDeviceInfo(),
        images: uploadedImages
      };

      try {
        const response = await fetch(`${API_BASE_URL}/api/submit`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showToast('提交成功，感谢你的反馈！', 'success');
          form.reset();
          uploadedImages = [];
          renderImagePreviews();
          updateCharCount();
          checkFormValidity();
        } else if (response.status === 401) {
          // Token 过期或无效
          showToast('登录已过期，请重新登录', 'error');
          localStorage.removeItem('feishu_openId');
          localStorage.removeItem('feishu_userName');
          localStorage.removeItem('feishu_userAvatar');
          checkLoginStatus();
        } else {
          showToast(result.message || '提交失败，请重试', 'error');
        }
      } catch (error) {
        console.error('Submit error:', error);
        showToast('网络错误，请检查网络连接后重试', 'error');
      } finally {
        setLoading(false);
      }
    }

    // 图片上传相关函数
    function handleImageUpload(files) {
      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) {
          showToast('请选择图片文件', 'error');
          return;
        }
        if (uploadedImages.length >= 5) {
          showToast('最多上传5张图片', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const imageData = e.target.result;
          uploadedImages.push(imageData);
          renderImagePreviews();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderImagePreviews() {
      imagePreviewList.innerHTML = uploadedImages.map((img, index) => `
        <div class="image-preview-item">
          <img src="${img}" alt="预览图${index + 1}">
          <button type="button" class="remove-btn" data-index="${index}">×</button>
        </div>
      `).join('');

      // 绑定删除按钮事件
      imagePreviewList.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const index = parseInt(e.target.dataset.index);
          uploadedImages.splice(index, 1);
          renderImagePreviews();
        });
      });
    }

    // 粘贴图片支持
    description.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      let hasImage = false;

      for (let i = 0; i < items.length; i++) {
        if (items[i].type.startsWith('image/')) {
          hasImage = true;
          const file = items[i].getAsFile();
          handleImageUpload([file]);
        }
      }

      // 如果有图片，阻止默认粘贴行为（避免图片也粘贴到文本中）
      if (hasImage) {
        e.preventDefault();
        showToast('图片已添加', 'success');
      }
    });

    // 事件监听
    loginBtn.addEventListener('click', login);
    description.addEventListener('input', () => {
      updateCharCount();
      checkFormValidity();
    });
    typeInputs.forEach(input => {
      input.addEventListener('change', checkFormValidity);
    });
    form.addEventListener('submit', submitForm);

    // 图片上传按钮
    uploadBtn.addEventListener('click', () => {
      imageInput.click();
    });

    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleImageUpload(e.target.files);
        imageInput.value = ''; // 清空以便重复选择同一文件
      }
    });

    // 初始化
    checkLoginStatus();
    updateCharCount();
  </script>
</body>
</html>
