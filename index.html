<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>用户反馈</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   设计系统 · 柔和米白暖色 · Notion/Craft 风
   ============================================================ */
:root {
  --bg: oklch(0.985 0.006 80);
  --bg-soft: oklch(0.97 0.008 75);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.985 0.006 80);
  --surface-hover: oklch(0.965 0.008 75);
  --border: oklch(0.92 0.008 75);
  --border-strong: oklch(0.86 0.01 75);
  --divider: oklch(0.94 0.006 75);
  --ink: oklch(0.22 0.01 60);
  --ink-2: oklch(0.38 0.01 60);
  --ink-3: oklch(0.56 0.008 60);
  --ink-4: oklch(0.72 0.006 60);
  --brand: oklch(0.62 0.14 42);
  --brand-hover: oklch(0.56 0.15 42);
  --brand-soft: oklch(0.96 0.03 50);
  --brand-ink: oklch(0.42 0.13 42);
  --info: oklch(0.58 0.11 240);
  --info-soft: oklch(0.96 0.025 240);
  --success: oklch(0.58 0.11 155);
  --success-soft: oklch(0.96 0.03 155);
  --warn: oklch(0.68 0.13 75);
  --warn-soft: oklch(0.96 0.04 80);
  --danger: oklch(0.6 0.16 25);
  --danger-soft: oklch(0.96 0.03 25);
  --purple: oklch(0.58 0.12 300);
  --purple-soft: oklch(0.96 0.025 300);
  --font-sans: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Source Serif 4", "Source Serif Pro", "Noto Serif SC", "Songti SC", Georgia, serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 30px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --r-2xl: 22px;
  --shadow-xs: 0 1px 2px oklch(0.2 0.02 60 / 0.04);
  --shadow-sm: 0 1px 3px oklch(0.2 0.02 60 / 0.05), 0 1px 2px oklch(0.2 0.02 60 / 0.03);
  --shadow-md: 0 4px 16px oklch(0.2 0.02 60 / 0.06), 0 1px 3px oklch(0.2 0.02 60 / 0.04);
  --shadow-lg: 0 12px 32px oklch(0.2 0.02 60 / 0.08), 0 4px 12px oklch(0.2 0.02 60 / 0.05);
  --shadow-xl: 0 24px 48px oklch(0.2 0.02 60 / 0.12), 0 8px 16px oklch(0.2 0.02 60 / 0.06);
  --focus-ring: 0 0 0 3px oklch(0.62 0.14 42 / 0.2);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 360ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: var(--text-base);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv11", "ss01", "ss03";
  -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; }
::selection { background: oklch(0.62 0.14 42 / 0.2); color: var(--ink); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: oklch(0.86 0.01 75); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.012 75); }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 页面 ---------- */
body {
  background:
    radial-gradient(1200px 500px at 50% -200px, oklch(0.96 0.04 45 / 0.6), transparent 70%),
    var(--bg);
  min-height: 100vh;
}
.page {
  max-width: 520px;
  margin: 0 auto;
  padding: 28px 20px calc(40px + env(safe-area-inset-bottom));
}

/* ---------- 页头 ---------- */
.hero {
  text-align: left;
  margin-bottom: 24px;
}
.hero .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--brand-soft);
  color: var(--brand-ink);
  font-size: var(--text-xs);
  font-weight: 500;
  border-radius: 999px;
  margin-bottom: 14px;
}
.hero .eyebrow::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--brand);
}
.hero h1 {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--ink);
  margin: 0 0 6px;
  letter-spacing: -0.01em;
}
.hero p {
  font-size: var(--text-md);
  color: var(--ink-3);
  margin: 0;
  max-width: 42ch;
}
.hero .user-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  padding: 5px 10px 5px 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: var(--text-xs);
  color: var(--ink-2);
}
.avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.7 0.14 42), oklch(0.6 0.14 25));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-sm);
  padding: 22px;
}
.card + .card { margin-top: 16px; }

.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}
.section-title .label {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.01em;
}
.section-title .label .req {
  color: var(--danger);
  margin-left: 3px;
}
.section-title .hint {
  font-size: var(--text-xs);
  color: var(--ink-4);
}

/* ---------- 空间 segmented ---------- */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.seg input { display: none; }
.seg label {
  text-align: center;
  padding: 8px 12px;
  border-radius: calc(var(--r-md) - 4px);
  font-size: var(--text-sm);
  color: var(--ink-2);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
  font-weight: 500;
}
.seg input:checked + label {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-xs);
}

/* ---------- 类型选择卡片 ---------- */
.type-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.type-card {
  position: relative;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 94px;
}
.type-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.type-card input { position: absolute; opacity: 0; pointer-events: none; }
.type-card .ic {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.type-card .ic svg { width: 18px; height: 18px; }
.type-card .t-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--ink);
  line-height: 1.25;
}
.type-card .t-desc {
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.45;
}
.type-card .check {
  position: absolute;
  top: 10px; right: 10px;
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  transition: all var(--dur) var(--ease);
}
.type-card.is-checked {
  border-color: var(--brand);
  background: linear-gradient(180deg, var(--brand-soft), var(--surface) 60%);
  box-shadow: 0 0 0 3px oklch(0.62 0.14 42 / 0.08);
}
.type-card.is-checked .check {
  border-color: var(--brand);
  background: var(--brand);
  box-shadow: inset 0 0 0 3px var(--surface);
}

.ic.ic-inaccurate { background: var(--purple-soft); color: oklch(0.48 0.14 300); }
.ic.ic-bug       { background: var(--danger-soft); color: var(--danger); }
.ic.ic-suggest   { background: var(--success-soft); color: oklch(0.45 0.12 155); }
.ic.ic-demand    { background: var(--warn-soft); color: oklch(0.48 0.13 75); }
.ic.ic-other     { background: var(--surface-2); color: var(--ink-3); }

/* ---------- 描述输入 ---------- */
.textarea-box {
  position: relative;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  transition: all var(--dur) var(--ease);
  overflow: hidden;
}
.textarea-box:focus-within {
  border-color: var(--brand);
  box-shadow: var(--focus-ring);
}
.textarea-box textarea {
  width: 100%;
  min-height: 128px;
  padding: 14px 14px 8px;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  font-family: inherit;
  font-size: var(--text-md);
  color: var(--ink);
  line-height: 1.6;
}
.textarea-box textarea::placeholder { color: var(--ink-4); }
.textarea-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-top: 1px solid var(--divider);
  background: var(--surface-2);
}
.paste-hint {
  font-size: var(--text-xs);
  color: var(--ink-3);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--ink-2);
}
.counter {
  font-size: var(--text-xs);
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.counter.warn { color: var(--danger); }

/* ---------- 图片上传 ---------- */
.uploader {
  margin-top: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 8px;
}
.drop-zone {
  grid-column: span 1;
  aspect-ratio: 1 / 1;
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-md);
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--ink-3);
  transition: all var(--dur) var(--ease);
  font-size: 11.5px;
  text-align: center;
  padding: 4px;
}
.drop-zone:hover,
.drop-zone.dragover {
  border-color: var(--brand);
  background: var(--brand-soft);
  color: var(--brand-ink);
}
.drop-zone svg { width: 22px; height: 22px; }
.thumb {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border);
  animation: pop 240ms var(--ease-out);
}
@keyframes pop {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.thumb img {
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}
.thumb .x {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: oklch(0.2 0.01 60 / 0.7);
  backdrop-filter: blur(6px);
  color: #fff;
  border: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  line-height: 1;
}
.thumb .x:hover { background: var(--danger); }

/* ---------- 输入框 ---------- */
.input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  font-size: var(--text-md);
  color: var(--ink);
  transition: all var(--dur) var(--ease);
  font-family: inherit;
}
.input:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: var(--focus-ring);
}
.input::placeholder { color: var(--ink-4); }

/* ---------- 提交按钮 ---------- */
.submit-wrap {
  position: sticky;
  bottom: 0;
  margin-top: 20px;
  padding: 16px 0 max(16px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}
.submit {
  width: 100%;
  padding: 14px 20px;
  background: var(--brand);
  color: #fff;
  border: 0;
  border-radius: var(--r-md);
  font-size: var(--text-md);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--dur) var(--ease);
  box-shadow: 0 4px 14px oklch(0.5 0.14 42 / 0.25), inset 0 1px 0 oklch(1 0 0 / 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.submit:hover:not(:disabled) { background: var(--brand-hover); transform: translateY(-1px); }
.submit:active:not(:disabled) { transform: translateY(0); }
.submit:disabled {
  background: oklch(0.88 0.008 75);
  color: var(--ink-4);
  cursor: not-allowed;
  box-shadow: none;
}
.submit.loading { color: transparent; pointer-events: none; }
.submit.loading::after {
  content: "";
  position: absolute;
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.5);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.submit { position: relative; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 成功态 ---------- */
.success-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 24px;
  animation: fade 300ms ease;
}
.success-screen.show { display: flex; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.success-card {
  max-width: 420px;
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-2xl);
  padding: 32px 28px 24px;
  text-align: center;
  box-shadow: var(--shadow-xl);
  animation: slideUp 400ms var(--ease-out);
}
@keyframes slideUp {
  from { transform: translateY(16px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.success-illust {
  width: 92px; height: 92px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, oklch(0.95 0.05 150), oklch(0.88 0.1 155));
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.success-illust::before, .success-illust::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: oklch(0.7 0.14 155 / 0.15);
}
.success-illust::before { width: 130px; height: 130px; animation: ring 1.8s ease-out infinite; }
.success-illust::after  { width: 160px; height: 160px; animation: ring 1.8s ease-out infinite 0.3s; }
@keyframes ring {
  from { transform: scale(0.5); opacity: 0.6; }
  to { transform: scale(1.2); opacity: 0; }
}
.success-illust svg {
  width: 44px; height: 44px;
  color: oklch(0.45 0.15 155);
  position: relative;
  z-index: 1;
  stroke-dasharray: 48;
  stroke-dashoffset: 48;
  animation: draw 500ms 200ms ease-out forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }

.success-card h2 {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 6px;
}
.success-card p {
  font-size: var(--text-sm);
  color: var(--ink-3);
  margin: 0 0 20px;
  line-height: 1.6;
}
.success-actions {
  display: flex;
  justify-content: center;
}
.success-actions .btn { min-width: 140px; }

/* ---------- 基础组件 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  font-size: var(--text-base);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--dur) var(--ease);
  white-space: nowrap;
  user-select: none;
}
.btn:active { transform: scale(0.985); }
.btn-primary {
  background: var(--brand);
  color: #fff;
  box-shadow: 0 1px 2px oklch(0.4 0.14 42 / 0.25), inset 0 1px 0 oklch(1 0 0 / 0.15);
}
.btn-primary:hover { background: var(--brand-hover); }
.btn-ghost {
  background: transparent;
  color: var(--ink-2);
  border-color: var(--border);
}
.btn-ghost:hover {
  background: var(--surface-hover);
  border-color: var(--border-strong);
  color: var(--ink);
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translate(-50%, -12px);
  background: var(--ink);
  color: oklch(0.96 0.005 75);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: var(--text-sm);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all var(--dur) var(--ease);
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--danger); color: #fff; }

@media (max-width: 380px) {
  .type-grid { grid-template-columns: 1fr; }
  .page { padding: 16px 14px calc(32px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<div class="page">
  <div class="hero">
    <div class="eyebrow">反馈中心</div>
    <h1>贴心Claw 用户反馈</h1>
    <p>每一条反馈都会被认真阅读，我们会尽快响应。</p>
    <div class="user-pill" id="userPill" style="display:none;">
      <span class="avatar" id="userAvatar"></span>
      <span id="userName"></span>
    </div>
  </div>

  <!-- 反馈表单 -->
  <form id="feedbackForm" style="display:none;">

    <!-- 所属空间 -->
    <div class="card">
      <div class="section-title">
        <span class="label">所属空间<span class="req">*</span></span>
        <span class="hint">单选</span>
      </div>
      <div class="seg">
        <input type="radio" id="sp-lzx" name="space" value="灵珠虾" />
        <label for="sp-lzx">灵珠虾</label>
        <input type="radio" id="sp-mwx" name="space" value="魔丸虾" />
        <label for="sp-mwx">魔丸虾</label>
      </div>
    </div>

    <!-- 问题类型 -->
    <div class="card">
      <div class="section-title">
        <span class="label">问题类型<span class="req">*</span></span>
        <span class="hint">单选</span>
      </div>
      <div class="type-grid" id="typeGrid">
        <label class="type-card" data-type="输出不准确">
          <input type="radio" name="type" value="输出不准确" />
          <span class="ic ic-inaccurate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.93 4.93 2.83 2.83"/><path d="m16.24 16.24 2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.93 19.07 2.83-2.83"/><path d="m16.24 7.76 2.83-2.83"/></svg>
          </span>
          <div>
            <div class="t-name">输出不准确</div>
            <div class="t-desc">回答错误 / 结果偏差</div>
          </div>
          <span class="check"></span>
        </label>
        <label class="type-card" data-type="BUG">
          <input type="radio" name="type" value="BUG" />
          <span class="ic ic-bug">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 2 1.88 1.88"/><path d="M14.12 3.88 16 2"/><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 20v-9"/><path d="M6.53 9C4.6 8.8 3 7.1 3 5"/><path d="M6 13H2"/><path d="M3 21c0-2.1 1.7-3.9 3.8-4"/><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"/><path d="M22 13h-4"/><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"/></svg>
          </span>
          <div>
            <div class="t-name">BUG</div>
            <div class="t-desc">页面崩溃 / 功能失效</div>
          </div>
          <span class="check"></span>
        </label>
        <label class="type-card" data-type="体验建议">
          <input type="radio" name="type" value="体验建议" />
          <span class="ic ic-suggest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8a6 6 0 0 0-12 0c0 1.5.36 2.5 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/></svg>
          </span>
          <div>
            <div class="t-name">体验建议</div>
            <div class="t-desc">流程 / 交互优化想法</div>
          </div>
          <span class="check"></span>
        </label>
        <label class="type-card" data-type="需求">
          <input type="radio" name="type" value="需求" />
          <span class="ic ic-demand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/><line x1="7" x2="15" y1="8" y2="8"/><line x1="7" x2="17" y1="12" y2="12"/><line x1="7" x2="13" y1="16" y2="16"/></svg>
          </span>
          <div>
            <div class="t-name">新需求</div>
            <div class="t-desc">希望新增的能力</div>
          </div>
          <span class="check"></span>
        </label>
        <label class="type-card" data-type="其他" style="grid-column: span 2;">
          <input type="radio" name="type" value="其他" />
          <span class="ic ic-other">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="12" r="1"/></svg>
          </span>
          <div>
            <div class="t-name">其他</div>
            <div class="t-desc">不属于以上任何一类</div>
          </div>
          <span class="check"></span>
        </label>
      </div>
    </div>

    <!-- 描述 -->
    <div class="card">
      <div class="section-title">
        <span class="label">详细描述<span class="req">*</span></span>
        <span class="counter" id="counter">0 / 500</span>
      </div>
      <div class="textarea-box">
        <textarea id="desc" name="description" maxlength="500"
          placeholder="比如：在魔丸虾空间的 XX 功能中，点击「生成」后返回的结果与预期不一致。"></textarea>
        <div class="textarea-footer">
          <span class="paste-hint">支持粘贴截图 · <span class="kbd">⌘V</span></span>
          <span></span>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <div class="uploader" id="uploader">
        <div class="drop-zone" id="dropZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span>拖拽或点击</span>
          <span style="font-size:10.5px;color:var(--ink-4)">最多 3 张 · 10MB</span>
        </div>
      </div>
    </div>

    <div class="submit-wrap">
      <button type="submit" class="submit" id="submitBtn" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        提交反馈
      </button>
    </div>
  </form>
</div>

<!-- 成功态 -->
<div class="success-screen" id="successScreen">
  <div class="success-card">
    <div class="success-illust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <h2>感谢你的反馈</h2>
    <p>我们已经收到了，会在 24 小时内响应。<br/>你可以继续提交新的反馈，或返回首页。</p>
    <div class="success-actions">
      <button type="button" class="btn btn-ghost" onclick="resetAndHide()">再写一条</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE_URL = window.location.origin;

  const formPage = document.getElementById('feedbackForm');
  const form = document.getElementById('feedbackForm');
  const submitBtn = document.getElementById('submitBtn');
  const desc = document.getElementById('desc');
  const counter = document.getElementById('counter');
  const toast = document.getElementById('toast');
  const typeInputs = document.querySelectorAll('input[name="type"]');
  const typeCards = document.querySelectorAll('.type-card');
  const fileInput = document.getElementById('fileInput');
  const uploader = document.getElementById('uploader');
  const dropZone = document.getElementById('dropZone');
  let files = [];

  // 检查登录状态
  async function checkLoginStatus() {
    try {
      const response = await fetch(`${API_BASE_URL}/api/user/info`, { credentials: 'include' });
      const result = await response.json();
      if (result.success && result.loggedIn) {
        formPage.style.display = 'block';
        if (result.name) {
          document.getElementById('userPill').style.display = 'inline-flex';
          document.getElementById('userAvatar').textContent = result.name[0] || '';
          document.getElementById('userName').textContent = result.name;
        }
      } else {
        window.location.href = `${API_BASE_URL}/api/auth/login?t=${Date.now()}`;
      }
    } catch (error) {
      window.location.href = `${API_BASE_URL}/api/auth/login?t=${Date.now()}`;
    }
  }

  // 类型选择
  typeCards.forEach(card => {
    card.addEventListener('click', () => {
      typeCards.forEach(c => c.classList.remove('is-checked'));
      card.classList.add('is-checked');
      validate();
    });
  });

  // 描述计数
  desc.addEventListener('input', () => {
    const n = desc.value.length;
    counter.textContent = `${n} / 500`;
    counter.classList.toggle('warn', n >= 450);
    validate();
  });

  // 表单验证
  function validate() {
    const hasType = [...typeInputs].some(i => i.checked);
    const hasDesc = desc.value.trim().length > 0;
    submitBtn.disabled = !(hasType && hasDesc);
  }

  // 图片上传
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value = ''; });

  ['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => {
    e.preventDefault(); dropZone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
  }));
  dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

  desc.addEventListener('paste', e => {
    const items = e.clipboardData?.items || [];
    let has = false;
    for (const it of items) {
      if (it.type.startsWith('image/')) {
        has = true;
        const f = it.getAsFile();
        handleFiles([new File([f], `pasted_${Date.now()}.png`, { type: f.type })]);
      }
    }
    if (has) { e.preventDefault(); showToast('已添加粘贴的图片'); }
  });

  function handleFiles(list) {
    for (const f of list) {
      if (!f.type.startsWith('image/')) { showToast('请选择图片文件', 'error'); continue; }
      if (files.length >= 3) { showToast('最多上传 3 张', 'error'); break; }
      if (f.size > 10 * 1024 * 1024) { showToast('单张不超过 10MB', 'error'); continue; }
      files.push(f);
    }
    renderThumbs();
  }

  function renderThumbs() {
    uploader.querySelectorAll('.thumb').forEach(n => n.remove());
    files.forEach((f, i) => {
      const r = new FileReader();
      r.onload = e => {
        const div = document.createElement('div');
        div.className = 'thumb';
        div.innerHTML = `<img src="${e.target.result}" /><button class="x" type="button">×</button>`;
        div.querySelector('.x').onclick = () => { files.splice(i,1); renderThumbs(); };
        uploader.insertBefore(div, dropZone);
        updateDropZone();
      };
      r.readAsDataURL(f);
    });
    updateDropZone();
  }

  function updateDropZone() {
    dropZone.style.display = files.length >= 3 ? 'none' : 'flex';
  }

  // 获取设备信息
  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let deviceInfo = '未知设备';
    if (/iPhone|iPad|iPod/.test(ua)) {
      deviceInfo = 'iOS ' + (ua.match(/OS (\d+[_\d]+)/)?.[1] || '');
    } else if (/Android/.test(ua)) {
      deviceInfo = 'Android ' + (ua.match(/Android (\d+\.?\d*)/)?.[1] || '');
    }
    return `${deviceInfo} | ${ua.slice(0, 100)}...`;
  }

  // 提交
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (submitBtn.disabled) return;

    submitBtn.classList.add('loading');
    submitBtn.disabled = true;

    const formData = new FormData();
    formData.append('issue_type', document.querySelector('input[name="type"]:checked').value);
    const spaceInput = document.querySelector('input[name="space"]:checked');
    formData.append('space', spaceInput ? spaceInput.value : '');
    formData.append('description', desc.value.trim());
    formData.append('device_info', getDeviceInfo());
    files.forEach(file => formData.append('images', file));

    try {
      const response = await fetch(`${API_BASE_URL}/api/feedback/submit`, {
        method: 'POST',
        credentials: 'include',
        body: formData
      });
      const result = await response.json();
      if (response.ok && result.success) {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        document.getElementById('successScreen').classList.add('show');
      } else if (response.status === 401) {
        showToast('登录已过期，请重新登录', 'error');
        checkLoginStatus();
      } else {
        showToast(result.message || '提交失败，请重试', 'error');
        submitBtn.classList.remove('loading');
        validate();
      }
    } catch (error) {
      showToast('网络错误，请检查网络连接后重试', 'error');
      submitBtn.classList.remove('loading');
      validate();
    }
  });

  function resetAndHide() {
    document.getElementById('successScreen').classList.remove('show');
    form.reset();
    files = []; renderThumbs();
    typeCards.forEach(c => c.classList.remove('is-checked'));
    counter.textContent = '0 / 500';
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
    validate();
  }

  // Toast
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.className = 'toast', 2200);
  }

  // 初始化
  checkLoginStatus();
</script>
</body>
</html>
