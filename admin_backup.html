<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>反馈管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   设计系统 · 柔和米白暖色 · Notion/Craft 风
   ============================================================ */
:root {
  --bg: oklch(0.985 0.006 80);
  --bg-soft: oklch(0.97 0.008 75);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.985 0.006 80);
  --surface-hover: oklch(0.965 0.008 75);
  --border: oklch(0.92 0.008 75);
  --border-strong: oklch(0.86 0.01 75);
  --divider: oklch(0.94 0.006 75);
  --ink: oklch(0.22 0.01 60);
  --ink-2: oklch(0.38 0.01 60);
  --ink-3: oklch(0.56 0.008 60);
  --ink-4: oklch(0.72 0.006 60);
  --brand: oklch(0.62 0.14 42);
  --brand-hover: oklch(0.56 0.15 42);
  --brand-soft: oklch(0.96 0.03 50);
  --brand-ink: oklch(0.42 0.13 42);
  --info: oklch(0.58 0.11 240);
  --info-soft: oklch(0.96 0.025 240);
  --success: oklch(0.58 0.11 155);
  --success-soft: oklch(0.96 0.03 155);
  --warn: oklch(0.68 0.13 75);
  --warn-soft: oklch(0.96 0.04 80);
  --danger: oklch(0.6 0.16 25);
  --danger-soft: oklch(0.96 0.03 25);
  --purple: oklch(0.58 0.12 300);
  --purple-soft: oklch(0.96 0.025 300);
  --font-sans: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Source Serif 4", "Source Serif Pro", "Noto Serif SC", "Songti SC", Georgia, serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 30px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --r-2xl: 22px;
  --shadow-xs: 0 1px 2px oklch(0.2 0.02 60 / 0.04);
  --shadow-sm: 0 1px 3px oklch(0.2 0.02 60 / 0.05), 0 1px 2px oklch(0.2 0.02 60 / 0.03);
  --shadow-md: 0 4px 16px oklch(0.2 0.02 60 / 0.06), 0 1px 3px oklch(0.2 0.02 60 / 0.04);
  --shadow-lg: 0 12px 32px oklch(0.2 0.02 60 / 0.08), 0 4px 12px oklch(0.2 0.02 60 / 0.05);
  --shadow-xl: 0 24px 48px oklch(0.2 0.02 60 / 0.12), 0 8px 16px oklch(0.2 0.02 60 / 0.06);
  --focus-ring: 0 0 0 3px oklch(0.62 0.14 42 / 0.2);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 360ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: var(--text-base);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button { font-family: inherit; }
::selection { background: oklch(0.62 0.14 42 / 0.2); color: var(--ink); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: oklch(0.86 0.01 75); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.012 75); }
::-webkit-scrollbar-track { background: transparent; }

body { min-height: 100vh; }

/* ---------- 密码弹窗 ---------- */
.pw-modal {
  position: fixed; inset: 0;
  background: oklch(0.2 0.02 60 / 0.4);
  backdrop-filter: blur(4px);
  display: flex; justify-content: center; align-items: center;
  z-index: 1000;
}
.pw-modal.hidden { display: none; }
.pw-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 36px 32px;
  box-shadow: var(--shadow-xl);
  width: 100%; max-width: 380px;
}
.pw-box h2 {
  font-family: var(--font-serif);
  font-size: var(--text-xl);
  font-weight: 600;
  color: var(--ink);
  text-align: center;
  margin-bottom: 20px;
}
.pw-box input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--text-md);
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
  margin-bottom: 14px;
  transition: all var(--dur) var(--ease);
}
.pw-box input:focus { outline: none; border-color: var(--brand); box-shadow: var(--focus-ring); }
.pw-box input::placeholder { color: var(--ink-4); }
.pw-box .pw-btn {
  width: 100%; padding: 10px 16px;
  background: var(--brand); color: #fff;
  border: 0; border-radius: var(--r-md);
  font-size: var(--text-md); font-weight: 600; cursor: pointer;
  transition: all var(--dur) var(--ease);
  box-shadow: 0 1px 2px oklch(0.4 0.14 42 / 0.25), inset 0 1px 0 oklch(1 0 0 / 0.15);
}
.pw-box .pw-btn:hover { background: var(--brand-hover); }
.pw-error { color: var(--danger); font-size: var(--text-sm); text-align: center; margin-top: 10px; }

/* ---------- 顶部 ---------- */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 28px;
  display: flex; align-items: center; gap: 18px;
  position: sticky; top: 0; z-index: 20;
}
.brand {
  display: flex; align-items: center; gap: 10px;
}
.brand .logo {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), oklch(0.6 0.16 25));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 13px;
}
.brand .nm { font-family: var(--font-serif); font-size: 15px; font-weight: 600; color: var(--ink); }
.topbar .crumbs {
  font-size: 13px; color: var(--ink-3);
  display: flex; align-items: center; gap: 6px;
}
.topbar .crumbs .here { color: var(--ink); font-weight: 500; }
.topbar .crumbs .sep { color: var(--ink-4); }
.topbar .spacer { flex: 1; }
.topbar .logout-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  color: var(--ink-2);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.topbar .logout-btn:hover { background: var(--surface-hover); color: var(--ink); border-color: var(--border-strong); }

/* ---------- KPI ---------- */
.kpi-strip {
  padding: 22px 28px 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 18px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
  overflow: hidden;
}
.kpi .lbl { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.kpi .row { display: flex; align-items: baseline; gap: 8px; }
.kpi .val { font-family: var(--font-serif); font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.1; }
.kpi .delta { font-size: 11.5px; padding: 2px 6px; border-radius: 4px; }
.kpi .delta.up { color: oklch(0.42 0.12 155); background: var(--success-soft); }
.kpi .delta.down { color: var(--danger); background: var(--danger-soft); }
.kpi .hint { font-size: 11.5px; color: var(--ink-4); margin-top: 2px; }
.kpi .spark { position: absolute; right: 14px; bottom: 14px; opacity: 0.6; }

/* ---------- 主面板 ---------- */
.panel {
  margin: 18px 28px 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}

/* 工具栏 */
.ptool {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--divider);
  flex-wrap: wrap;
}
.search {
  flex: 1; min-width: 180px; max-width: 360px;
  position: relative;
}
.search input {
  width: 100%;
  padding: 7px 12px 7px 30px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-soft);
  font-family: inherit; font-size: 13px; color: var(--ink);
}
.search input:focus { outline: 0; border-color: var(--brand); box-shadow: var(--focus-ring); background: var(--surface); }
.search input::placeholder { color: var(--ink-4); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-4); width: 13px; height: 13px; }

.seg-filter {
  display: inline-flex;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 2px;
  gap: 1px;
}
.seg-filter button {
  padding: 5px 11px;
  border: 0; background: transparent;
  font-size: 12px; color: var(--ink-2);
  cursor: pointer; border-radius: 5px; font-family: inherit;
  display: inline-flex; align-items: center; gap: 4px;
  transition: all var(--dur) var(--ease);
}
.seg-filter button:hover { color: var(--ink); }
.seg-filter button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); font-weight: 500; }
.seg-filter button .n { font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.seg-filter button.active .n { color: var(--brand-ink); }

.icon-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-md);
  color: var(--ink-3);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surface-hover); color: var(--ink); }
.icon-btn svg { width: 14px; height: 14px; }

.tool-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.count-lbl { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table.tbl {
  width: 100%;
  border-collapse: separate; border-spacing: 0;
  font-size: 13px;
  min-width: 900px;
}
.tbl thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.tbl tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--divider);
  vertical-align: middle;
}
.tbl tbody tr {
  cursor: pointer;
  transition: background var(--dur) var(--ease);
}
.tbl tbody tr:hover { background: var(--bg-soft); }
.tbl tbody tr.selected { background: var(--brand-soft); }
.tbl tbody tr:last-child td { border-bottom: 0; }

.ck {
  width: 16px; height: 16px;
  border: 1.5px solid var(--border-strong);
  border-radius: 4px;
  background: var(--surface);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  vertical-align: middle;
  transition: all var(--dur) var(--ease);
}
.ck:hover { border-color: var(--brand); }
.ck.checked { background: var(--brand); border-color: var(--brand); }
.ck.checked::after {
  content: ""; width: 7px; height: 4px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: translateY(-1px) rotate(-45deg);
}

.id-col { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }

.type-tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 5px;
  font-size: 11.5px; font-weight: 500;
  white-space: nowrap;
}
.type-tag::before { content:""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.type-tag.inaccurate { background: var(--purple-soft); color: oklch(0.45 0.14 300); }
.type-tag.bug { background: var(--danger-soft); color: var(--danger); }
.type-tag.suggest { background: var(--success-soft); color: oklch(0.42 0.12 155); }
.type-tag.demand { background: var(--warn-soft); color: oklch(0.45 0.13 75); }
.type-tag.other { background: var(--surface-2); color: var(--ink-3); }

.space-tag {
  padding: 2px 7px; border-radius: 4px;
  background: var(--info-soft); color: oklch(0.42 0.11 240);
  font-size: 11.5px; font-weight: 500; white-space: nowrap;
}

.desc-cell {
  color: var(--ink);
  max-width: 380px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.desc-cell .imgs-inline {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 6px; background: var(--surface-2);
  border-radius: 4px; font-size: 10.5px; color: var(--ink-3);
  margin-left: 6px; vertical-align: middle;
  font-variant-numeric: tabular-nums;
}
.desc-cell .imgs-inline svg { width: 10px; height: 10px; }

.user-cell {
  display: flex; align-items: center; gap: 8px;
  white-space: nowrap;
}
.user-cell .av {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.75 0.08 180), oklch(0.55 0.12 220));
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 600;
}
.user-cell .u-contact { font-size: 11px; color: var(--ink-4); margin-top: 1px; }

.time-cell { color: var(--ink-3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* 状态下拉 */
.status-sel {
  position: relative; display: inline-block;
}
.status-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px 3px 10px; border: 1px solid transparent;
  border-radius: 999px; cursor: pointer;
  font-size: 11.5px; font-weight: 500;
  font-family: inherit;
  background: transparent;
  transition: all var(--dur) var(--ease);
}
.status-btn::before { content:""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-btn svg { width: 11px; height: 11px; color: var(--ink-4); }
.status-btn:hover { border-color: currentColor; }
.status-btn.collecting { color: oklch(0.45 0.11 240); background: var(--info-soft); }
.status-btn.resolving { color: oklch(0.48 0.13 75); background: var(--warn-soft); }
.status-btn.resolved { color: oklch(0.42 0.12 155); background: var(--success-soft); }
.status-menu {
  position: absolute; top: calc(100% + 4px); right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 4px;
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 10;
  min-width: 130px;
}
.status-sel.open .status-menu { display: block; }
.status-menu .opt {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px;
  font-size: 12px; color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--dur) var(--ease);
}
.status-menu .opt:hover { background: var(--bg-soft); color: var(--ink); }
.status-menu .opt .d { width: 7px; height: 7px; border-radius: 50%; }

.row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity var(--dur) var(--ease); }
.tbl tbody tr:hover .row-actions { opacity: 1; }
.row-actions .ra {
  width: 24px; height: 24px; border: 0;
  background: transparent; cursor: pointer;
  border-radius: 5px; color: var(--ink-3);
  display: inline-flex; align-items: center; justify-content: center;
}
.row-actions .ra:hover { background: var(--surface-2); color: var(--ink); }
.row-actions .ra svg { width: 13px; height: 13px; }

/* 分页 */
.paginate {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  border-top: 1px solid var(--divider);
  font-size: 12.5px;
  color: var(--ink-3);
}
.pager {
  display: flex; align-items: center; gap: 2px;
}
.pager button {
  min-width: 28px; height: 28px; padding: 0 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  font-size: 12px; color: var(--ink-2);
  cursor: pointer;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  transition: all var(--dur) var(--ease);
}
.pager button:hover { background: var(--bg-soft); }
.pager button.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pager button:disabled { opacity: 0.5; cursor: not-allowed; }

/* 骨架屏 */
@keyframes shim {
  0% { background-position: -200px 0; }
  100% { background-position: calc(200px + 100%) 0; }
}
.skel-bar {
  height: 12px; border-radius: 4px;
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-hover) 50%, var(--surface-2) 100%);
  background-size: 200px 100%;
  animation: shim 1.4s infinite linear;
}

/* 批量栏 */
.batch-bar {
  position: fixed;
  bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120%);
  background: var(--ink); color: oklch(0.96 0.005 75);
  padding: 10px 14px 10px 18px;
  border-radius: 12px;
  display: flex; align-items: center; gap: 14px;
  font-size: 13px;
  box-shadow: var(--shadow-xl);
  z-index: 30;
  transition: transform var(--dur-slow) var(--ease-out);
}
.batch-bar.show { transform: translateX(-50%) translateY(0); }
.batch-bar .cnt { background: var(--brand); color: #fff; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.batch-bar .sep { width: 1px; height: 16px; background: oklch(1 0 0 / 0.15); }
.batch-bar button {
  background: transparent; border: 0; color: inherit;
  font-size: 12.5px; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 6px;
}
.batch-bar button:hover { background: oklch(1 0 0 / 0.08); }
.batch-bar button svg { width: 13px; height: 13px; }

/* 抽屉 */
.drawer-scrim {
  position: fixed; inset: 0;
  background: oklch(0.2 0.02 60 / 0.35);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  z-index: 40;
}
.drawer-scrim.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0;
  width: 480px; max-width: 92vw;
  height: 100vh; background: var(--surface);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform var(--dur-slow) var(--ease-out);
  z-index: 50;
  display: flex; flex-direction: column;
}
.drawer.show { transform: translateX(0); }
.drawer-head {
  padding: 16px 22px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--divider);
}
.drawer-head .close {
  width: 28px; height: 28px; border-radius: 8px;
  border: 0; background: transparent;
  color: var(--ink-3); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.drawer-head .close:hover { background: var(--surface-hover); color: var(--ink); }
.drawer-head .ttl { font-family: var(--font-serif); font-size: 15px; font-weight: 600; color: var(--ink); }
.drawer-head .id { font-family: var(--font-mono); font-size: 12px; color: var(--ink-4); margin-left: auto; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .flabel { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
.field .fvalue { font-size: 13.5px; color: var(--ink); }
.desc-block {
  padding: 14px; background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: var(--r-md);
  font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.drawer-images {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.drawer-images img {
  width: 80px; height: 80px; object-fit: cover;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform var(--dur) var(--ease);
}
.drawer-images img:hover { transform: scale(1.05); }
.drawer-foot { padding: 12px 22px; border-top: 1px solid var(--divider); display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 16px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  font-size: var(--text-base); font-weight: 500;
  cursor: pointer; transition: all var(--dur) var(--ease);
  white-space: nowrap; user-select: none;
}
.btn:active { transform: scale(0.985); }
.btn-primary {
  background: var(--brand); color: #fff;
  box-shadow: 0 1px 2px oklch(0.4 0.14 42 / 0.25), inset 0 1px 0 oklch(1 0 0 / 0.15);
}
.btn-primary:hover { background: var(--brand-hover); }
.btn-ghost {
  background: transparent; color: var(--ink-2);
  border-color: var(--border);
}
.btn-ghost:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--ink); }
.drawer-foot .btn { flex: 1; padding: 9px 14px; font-size: 12.5px; }

/* 图片放大弹窗 */
.img-modal {
  position: fixed; inset: 0;
  background: oklch(0.15 0.02 60 / 0.92);
  backdrop-filter: blur(8px);
  display: none; justify-content: center; align-items: center;
  z-index: 2000;
}
.img-modal.show { display: flex; }
.img-modal img { max-width: 90%; max-height: 85%; object-fit: contain; border-radius: var(--r-md); }
.img-modal .close-btn {
  position: absolute; top: 20px; right: 20px;
  width: 36px; height: 36px;
  background: oklch(1 0 0 / 0.15); backdrop-filter: blur(6px);
  border: 0; border-radius: 50%;
  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.img-modal .close-btn:hover { background: oklch(1 0 0 / 0.25); }
.img-modal .nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px;
  background: oklch(1 0 0 / 0.15); backdrop-filter: blur(6px);
  border: 0; border-radius: 50%;
  color: #fff; font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.img-modal .nav-btn:hover { background: oklch(1 0 0 / 0.25); }
.img-modal .nav-btn.prev { left: 20px; }
.img-modal .nav-btn.next { right: 20px; }
.img-modal .img-counter {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 13px;
  background: oklch(0 0 0 / 0.5);
  padding: 6px 14px; border-radius: 20px;
  font-variant-numeric: tabular-nums;
}

/* 加载状态 */
.loading-state { padding: 40px; text-align: center; color: var(--ink-4); }

@media (max-width: 960px) {
  .kpi-strip { grid-template-columns: repeat(2, 1fr); }
  .topbar { padding: 12px 16px; }
  .panel { margin: 14px 16px 16px; }
  .kpi-strip { padding: 16px 16px 0; }
}
</style>
</head>
<body>

<!-- 密码弹窗 -->
<div class="pw-modal" id="pwModal">
  <div class="pw-box">
    <h2>管理后台登录</h2>
    <input type="password" id="pwInput" placeholder="请输入管理密码" autofocus />
    <button class="pw-btn" onclick="verifyPassword()">进入后台</button>
    <div class="pw-error" id="pwError"></div>
  </div>
</div>

<!-- 主内容 -->
<div id="mainContent" style="display:none;">

  <!-- 顶部 -->
  <div class="topbar">
    <div class="brand">
      <div class="logo">反</div>
      <div class="nm">反馈中心</div>
    </div>
    <div class="crumbs">
      <span>工作台</span><span class="sep">/</span><span class="here">反馈列表</span>
    </div>
    <div class="spacer"></div>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </div>

  <!-- KPI -->
  <div class="kpi-strip" id="kpiStrip">
    <div class="kpi">
      <span class="lbl">总反馈</span>
      <div class="row"><span class="val" id="kpiTotal">-</span></div>
      <span class="hint">全部反馈数量</span>
    </div>
    <div class="kpi">
      <span class="lbl">待处理</span>
      <div class="row"><span class="val" id="kpiPending" style="color:var(--danger);">-</span></div>
      <span class="hint">收集中</span>
    </div>
    <div class="kpi">
      <span class="lbl">解决中</span>
      <div class="row"><span class="val" id="kpiResolving">-</span></div>
      <span class="hint">正在处理</span>
    </div>
    <div class="kpi">
      <span class="lbl">已解决</span>
      <div class="row"><span class="val" id="kpiResolved">-</span></div>
      <span class="hint">已完成</span>
    </div>
  </div>

  <!-- 主面板 -->
  <div class="panel">
    <div class="ptool">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="搜索描述 / 提交人…" />
      </div>

      <div class="seg-filter" id="statusFilter">
        <button class="active" data-status="all">全部</button>
        <button data-status="收集中">待处理</button>
        <button data-status="解决中">解决中</button>
        <button data-status="已解决">已解决</button>
      </div>

      <div class="seg-filter" id="typeFilter">
        <button class="active" data-type="all">全部类型</button>
        <button data-type="输出不准确">不准确</button>
        <button data-type="BUG">BUG</button>
        <button data-type="体验建议">建议</button>
        <button data-type="需求">需求</button>
      </div>

      <button class="icon-btn" title="高级筛选" id="advFilterBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>

      <div class="tool-right">
        <span class="count-lbl" id="countLbl">-</span>
        <button class="icon-btn" title="导出" onclick="exportToExcel()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        </button>
      </div>
    </div>

    <!-- 高级筛选 -->
    <div id="advFilterPanel" style="display:none; padding:14px 18px; border-bottom:1px solid var(--divider); background:var(--bg-soft);">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span style="font-size:12px; color:var(--ink-3); min-width:60px;">所属空间</span>
        <div class="seg-filter" id="spaceFilter">
          <button class="active" data-space="all">全部</button>
          <button data-space="灵珠虾">灵珠虾</button>
          <button data-space="魔丸虾">魔丸虾</button>
        </div>
        <span style="font-size:12px; color:var(--ink-3); min-width:60px; margin-left:12px;">提交时间</span>
        <input type="date" id="startDate" style="padding:5px 8px; border:1px solid var(--border); border-radius:var(--r-sm); font-size:12px; color:var(--ink); background:var(--surface);" />
        <span style="color:var(--ink-4); font-size:12px;">至</span>
        <input type="date" id="endDate" style="padding:5px 8px; border:1px solid var(--border); border-radius:var(--r-sm); font-size:12px; color:var(--ink); background:var(--surface);" />
        <button class="icon-btn" title="清除日期" onclick="clearDateFilter()" style="width:auto; padding:0 8px; font-size:11px;">清除</button>
      </div>
    </div>

    <div class="tbl-wrap">
      <table class="tbl">
        <thead>
          <tr>
            <th style="width:36px;"><span class="ck" id="ckAll"></span></th>
            <th style="width:88px;">ID</th>
            <th style="width:100px;">类型</th>
            <th>描述</th>
            <th style="width:100px;">空间</th>
            <th style="width:170px;">提交人</th>
            <th style="width:180px;">所属部门</th>
            <th style="width:140px;">时间</th>
            <th style="width:110px;">状态</th>
            <th style="width:72px;"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="paginate" id="paginate"></div>
  </div>
</div>

<!-- 批量栏 -->
<div class="batch-bar" id="batchBar">
  <span>已选择 <span class="cnt" id="batchCount">0</span> 条</span>
  <span class="sep"></span>
  <button onclick="batchSetStatus('已解决')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m5 12 5 5L20 7"/></svg>标为已解决</button>
  <button onclick="batchSetStatus('解决中')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v10l3 3"/><circle cx="12" cy="12" r="10"/></svg>改为解决中</button>
  <span class="sep"></span>
  <button id="batchClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>取消</button>
</div>

<!-- 抽屉 -->
<div class="drawer-scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <button class="close" id="drawerClose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <span class="ttl">反馈详情</span>
    <span class="id" id="drawerId"></span>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <button class="btn btn-ghost" onclick="closeDrawer()">关闭</button>
    <button class="btn btn-primary" id="drawerResolveBtn">标为已解决</button>
  </div>
</div>

<!-- 图片放大弹窗 -->
<div class="img-modal" id="imgModal">
  <button class="close-btn" onclick="closeImageModal()">&times;</button>
  <button class="nav-btn prev" onclick="navigateImage(-1)">&lsaquo;</button>
  <img src="" alt="" id="modalImage" />
  <button class="nav-btn next" onclick="navigateImage(1)">&rsaquo;</button>
  <div class="img-counter" id="imgCounter"></div>
</div>

<script>
  const API_BASE_URL = window.location.origin;
  const PASSWORD_KEY = 'admin_password';

  // 部门缓存（留空，由服务端在提交时写入）

  let currentPage = 1;
  let currentTypeFilter = 'all';
  let currentStatusFilter = 'all';
  let currentSpaceFilter = 'all';
  let currentImages = [];
  let currentImageIndex = 0;
  let feedbackList = [];
  let drawerItemId = null;

  const STATUS_META = {
    '收集中': { cls: 'collecting' },
    '解决中': { cls: 'resolving' },
    '已解决': { cls: 'resolved' }
  };

  // 密码验证
  window.onload = function() {
    const savedPassword = localStorage.getItem(PASSWORD_KEY);
    if (savedPassword) verifyPassword(savedPassword);
  };

  document.getElementById('pwInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') verifyPassword();
  });

  async function verifyPassword(password) {
    const inputPassword = password || document.getElementById('pwInput').value;
    const errorEl = document.getElementById('pwError');
    try {
      const response = await fetch(`${API_BASE_URL}/api/feedback/stats`, {
        headers: { 'Admin-Password': inputPassword }
      });
      if (response.ok) {
        localStorage.setItem(PASSWORD_KEY, inputPassword);
        document.getElementById('pwModal').classList.add('hidden');
        document.getElementById('mainContent').style.display = 'block';
        loadStats();
        loadFeedbackList();
      } else {
        errorEl.textContent = '密码错误，请重试';
        localStorage.removeItem(PASSWORD_KEY);
      }
    } catch (error) {
      errorEl.textContent = '验证失败，请检查网络';
    }
  }

  // 加载统计
  async function loadStats() {
    try {
      const password = localStorage.getItem(PASSWORD_KEY);
      const response = await fetch(`${API_BASE_URL}/api/feedback/stats`, {
        headers: { 'Admin-Password': password }
      });
      if (!response.ok) return;
      const result = await response.json();
      if (result.success) {
        document.getElementById('kpiTotal').textContent = result.total || 0;
        document.getElementById('kpiPending').textContent = result.by_status?.['收集中'] || 0;
        document.getElementById('kpiResolving').textContent = result.by_status?.['解决中'] || 0;
        document.getElementById('kpiResolved').textContent = result.by_status?.['已解决'] || 0;
      }
    } catch (error) {
      console.error('加载统计失败:', error);
    }
  }

  // 加载列表
  async function loadFeedbackList() {
    const password = localStorage.getItem(PASSWORD_KEY);
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '<tr><td colspan="10" class="loading-state">加载中…</td></tr>';

    try {
      let url = `${API_BASE_URL}/api/feedback/list?page=${currentPage}&page_size=20`;
      if (currentTypeFilter !== 'all') url += `&issue_type=${encodeURIComponent(currentTypeFilter)}`;
      if (currentStatusFilter !== 'all') url += `&status=${encodeURIComponent(currentStatusFilter)}`;
      if (currentSpaceFilter !== 'all') url += `&space=${encodeURIComponent(currentSpaceFilter)}`;
      const startDate = document.getElementById('startDate')?.value;
      const endDate = document.getElementById('endDate')?.value;
      if (startDate) url += `&start_date=${encodeURIComponent(startDate)}`;
      if (endDate) url += `&end_date=${encodeURIComponent(endDate)}`;

      const response = await fetch(url, { headers: { 'Admin-Password': password } });
      if (!response.ok) {
        if (response.status === 401) { localStorage.removeItem(PASSWORD_KEY); location.reload(); }
        return;
      }
      const result = await response.json();
      if (result.success) {
        feedbackList = result.list;
        renderTable(result.list);
        renderPagination(result.total_pages, result.total);
        document.getElementById('countLbl').textContent = `${result.list.length} / ${result.total}`;
      }
    } catch (error) {
      console.error('加载列表失败:', error);
      tbody.innerHTML = '<tr><td colspan="10" class="loading-state">加载失败，请刷新重试</td></tr>';
    }
  }

  function getTypeClass(type) {
    const map = { '输出不准确':'inaccurate', 'BUG':'bug', '体验建议':'suggest', '需求':'demand', '其他':'other' };
    return map[type] || 'other';
  }

  function formatDateTime(dateStr) {
    const d = new Date(dateStr);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function parseUserName(raw) {
    if (!raw) return { name: '匿名', employeeNo: '', display: '匿名', initial: '匿' };
    const m = raw.match(/^(.+?)（(\d+)）$/);
    if (m) return { name: m[1], employeeNo: m[2], display: `${m[1]}（${m[2]}）`, initial: m[1][0] };
    return { name: raw, employeeNo: '', display: raw, initial: raw[0] };
  }

  // 渲染表格
  function renderTable(list) {
    const tbody = document.getElementById('tbody');
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="10" class="loading-state">暂无反馈数据</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(item => {
      const s = STATUS_META[item.status] || STATUS_META['收集中'];
      const tc = getTypeClass(item.issue_type);
      const u = parseUserName(item.user_name);
      return `
      <tr data-id="${item.id}">
        <td><span class="ck row-ck" data-id="${item.id}"></span></td>
        <td class="id-col">#${String(item.id).padStart(4,'0')}</td>
        <td><span class="type-tag ${tc}">${escapeHtml(item.issue_type)}</span></td>
        <td class="desc-cell">${escapeHtml(item.description)}${item.images && item.images.length ? `<span class="imgs-inline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>${item.images.length}</span>` : ''}</td>
        <td>${item.space ? `<span class="space-tag">${escapeHtml(item.space)}</span>` : '<span style="color:var(--ink-4);font-size:12px;">-</span>'}</td>
        <td>
          <div class="user-cell">
            <span class="av">${escapeHtml(u.initial)}</span>
            <div>
              <div>${escapeHtml(u.display)}</div>
              ${item.contact ? `<div class="u-contact">${escapeHtml(item.contact)}</div>` : ''}
            </div>
          </div>
        </td>
        <td style="font-size:12px; color:var(--ink-3); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${item.department || '—'}">${item.department || '—'}</td>
        <td class="time-cell">${formatDateTime(item.created_at)}</td>
        <td>
          <div class="status-sel" data-item-id="${item.id}">
            <button class="status-btn ${s.cls}" data-status-btn>${item.status || '收集中'}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="status-menu">
              <div class="opt" data-set="收集中"><span class="d" style="background:oklch(0.45 0.11 240);"></span>收集中</div>
              <div class="opt" data-set="解决中"><span class="d" style="background:oklch(0.48 0.13 75);"></span>解决中</div>
              <div class="opt" data-set="已解决"><span class="d" style="background:oklch(0.42 0.12 155);"></span>已解决</div>
            </div>
          </div>
        </td>
        <td>
          <div class="row-actions">
            <button class="ra" title="详情" onclick="event.stopPropagation();openDrawer(${item.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
        </td>
      </tr>`;
    }).join('');

    // 行点击打开抽屉
    tbody.querySelectorAll('tr').forEach(tr => {
      tr.addEventListener('click', e => {
        if (e.target.closest('.ck, .status-sel, .row-actions')) return;
        openDrawer(parseInt(tr.dataset.id));
      });
    });

    // 勾选
    tbody.querySelectorAll('.row-ck').forEach(ck => {
      ck.onclick = e => {
        e.stopPropagation();
        ck.classList.toggle('checked');
        ck.closest('tr').classList.toggle('selected', ck.classList.contains('checked'));
        updateBatch();
      };
    });

    // 状态下拉
    tbody.querySelectorAll('.status-sel').forEach(sel => {
      const btn = sel.querySelector('[data-status-btn]');
      btn.onclick = e => {
        e.stopPropagation();
        document.querySelectorAll('.status-sel.open').forEach(x => x !== sel && x.classList.remove('open'));
        sel.classList.toggle('open');
      };
      sel.querySelectorAll('.opt').forEach(opt => {
        opt.onclick = e => {
          e.stopPropagation();
          const newStatus = opt.dataset.set;
          const itemId = parseInt(sel.dataset.itemId);
          changeStatus(itemId, newStatus, sel);
        };
      });
    });
  }

  // 修改状态
  async function changeStatus(id, newStatus, selEl) {
    const password = localStorage.getItem(PASSWORD_KEY);
    try {
      const response = await fetch(`${API_BASE_URL}/api/feedback/update-status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Admin-Password': password },
        body: JSON.stringify({ id, status: newStatus })
      });
      const result = await response.json();
      if (result.success) {
        loadFeedbackList();
        loadStats();
      } else {
        alert(result.message || '更新失败');
      }
    } catch (error) {
      alert('更新失败，请重试');
    }
  }

  document.addEventListener('click', () => document.querySelectorAll('.status-sel.open').forEach(s => s.classList.remove('open')));

  // 全选
  document.getElementById('ckAll').onclick = function() {
    const on = !this.classList.contains('checked');
    this.classList.toggle('checked', on);
    document.querySelectorAll('.row-ck').forEach(c => {
      c.classList.toggle('checked', on);
      c.closest('tr').classList.toggle('selected', on);
    });
    updateBatch();
  };

  // 批量操作
  function updateBatch() {
    const n = document.querySelectorAll('.row-ck.checked').length;
    document.getElementById('batchCount').textContent = n;
    document.getElementById('batchBar').classList.toggle('show', n > 0);
  }

  document.getElementById('batchClear').onclick = () => {
    document.querySelectorAll('.row-ck.checked').forEach(c => c.classList.remove('checked'));
    document.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
    document.getElementById('ckAll').classList.remove('checked');
    updateBatch();
  };

  async function batchSetStatus(status) {
    const ids = [...document.querySelectorAll('.row-ck.checked')].map(c => parseInt(c.dataset.id));
    if (ids.length === 0) return;
    const password = localStorage.getItem(PASSWORD_KEY);
    for (const id of ids) {
      await fetch(`${API_BASE_URL}/api/feedback/update-status`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Admin-Password': password },
        body: JSON.stringify({ id, status })
      });
    }
    document.getElementById('batchClear').click();
    loadFeedbackList();
    loadStats();
  }

  // 筛选
  document.querySelectorAll('#statusFilter button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#statusFilter button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatusFilter = btn.dataset.status;
      currentPage = 1;
      loadFeedbackList();
    };
  });

  document.querySelectorAll('#typeFilter button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#typeFilter button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTypeFilter = btn.dataset.type;
      currentPage = 1;
      loadFeedbackList();
    };
  });

  document.querySelectorAll('#spaceFilter button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#spaceFilter button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentSpaceFilter = btn.dataset.space;
      currentPage = 1;
      loadFeedbackList();
    };
  });

  // 高级筛选
  document.getElementById('advFilterBtn').onclick = () => {
    const panel = document.getElementById('advFilterPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  };

  document.getElementById('startDate').onchange = () => { currentPage = 1; loadFeedbackList(); };
  document.getElementById('endDate').onchange = () => { currentPage = 1; loadFeedbackList(); };

  function clearDateFilter() {
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    currentPage = 1;
    loadFeedbackList();
  }

  // 搜索
  document.getElementById('searchInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') { currentPage = 1; loadFeedbackList(); }
  });

  // 分页
  function renderPagination(totalPages, total) {
    const el = document.getElementById('paginate');
    if (totalPages <= 1) { el.innerHTML = `<span>共 ${total} 条</span><div></div>`; return; }
    let pages = [];
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
        pages.push(i);
      } else if (pages[pages.length-1] !== '...') {
        pages.push('...');
      }
    }
    el.innerHTML = `
      <span>共 ${total} 条 · 每页 20 条</span>
      <div class="pager">
        <button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage-1})">‹</button>
        ${pages.map(p => p === '...' ? '<button disabled>…</button>' : `<button class="${p===currentPage?'active':''}" onclick="goToPage(${p})">${p}</button>`).join('')}
        <button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage+1})">›</button>
      </div>`;
  }

  function goToPage(page) { currentPage = page; loadFeedbackList(); }

  // 抽屉
  function openDrawer(id) {
    drawerItemId = id;
    const item = feedbackList.find(f => f.id === id);
    if (!item) return;
    const s = STATUS_META[item.status] || STATUS_META['收集中'];
    const tc = getTypeClass(item.issue_type);

    document.getElementById('drawerId').textContent = '#' + String(item.id).padStart(4,'0');
    document.getElementById('drawerBody').innerHTML = `
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <span class="type-tag ${tc}">${escapeHtml(item.issue_type)}</span>
        ${item.space ? `<span class="space-tag">${escapeHtml(item.space)}</span>` : ''}
        <span style="font-size:12px; color:var(--ink-4); margin-left:auto; font-family:var(--font-mono);">${formatDateTime(item.created_at)}</span>
      </div>
      <div class="field">
        <span class="flabel">问题描述</span>
        <div class="desc-block">${escapeHtml(item.description)}</div>
      </div>
      ${item.images && item.images.length ? `
      <div class="field">
        <span class="flabel">附件图片</span>
        <div class="drawer-images">
          ${item.images.map((img,i) => `<img src="${API_BASE_URL}/data/uploads/${img}" onclick="openImageModal(${JSON.stringify(item.images).replace(/"/g,'&quot;')}, ${i})" />`).join('')}
        </div>
      </div>` : ''}
      <div class="field">
        <span class="flabel">提交人</span>
        <div class="fvalue" style="display:flex; align-items:center; gap:8px;">
          <span class="av" style="width:24px;height:24px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,oklch(0.75 0.1 180),oklch(0.55 0.14 220));color:#fff;font-weight:600;">${escapeHtml(parseUserName(item.user_name).initial)}</span>
          ${escapeHtml(parseUserName(item.user_name).display)}
          ${item.contact ? `<span style="color:var(--ink-3); font-size:12px;">· ${escapeHtml(item.contact)}</span>` : ''}
        </div>
      </div>
      <div class="field">
        <span class="flabel">所属部门</span>
        <div class="fvalue" style="font-size:13px; color:var(--ink-3);">${item.department || '—'}</div>
      </div>
      <div class="field">
        <span class="flabel">状态</span>
        <div class="status-sel" data-item-id="${item.id}" style="position:static;">
          <button class="status-btn ${s.cls}" data-status-btn>${item.status || '收集中'}
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="status-menu">
            <div class="opt" data-set="收集中"><span class="d" style="background:oklch(0.45 0.11 240);"></span>收集中</div>
            <div class="opt" data-set="解决中"><span class="d" style="background:oklch(0.48 0.13 75);"></span>解决中</div>
            <div class="opt" data-set="已解决"><span class="d" style="background:oklch(0.42 0.12 155);"></span>已解决</div>
          </div>
        </div>
      </div>
      ${item.device_info ? `
      <div class="field">
        <span class="flabel">设备信息</span>
        <div class="fvalue" style="font-size:12px; color:var(--ink-3); font-family:var(--font-mono);">${escapeHtml(item.device_info)}</div>
      </div>` : ''}`;

    // 状态下拉
    const sel = document.getElementById('drawerBody').querySelector('.status-sel');
    const btn = sel.querySelector('[data-status-btn]');
    btn.onclick = e => {
      e.stopPropagation();
      document.querySelectorAll('.status-sel.open').forEach(x => x !== sel && x.classList.remove('open'));
      sel.classList.toggle('open');
    };
    sel.querySelectorAll('.opt').forEach(opt => {
      opt.onclick = e => {
        e.stopPropagation();
        changeStatus(item.id, opt.dataset.set, sel);
        closeDrawer();
      };
    });

    // 底部按钮
    const resolveBtn = document.getElementById('drawerResolveBtn');
    const nextStatus = { '收集中': '解决中', '解决中': '已解决' };
    const ns = nextStatus[item.status];
    if (ns) {
      resolveBtn.textContent = `标为${ns}`;
      resolveBtn.onclick = () => { changeStatus(item.id, ns); closeDrawer(); };
    } else {
      resolveBtn.textContent = '已完成';
      resolveBtn.disabled = true;
    }

    document.getElementById('scrim').classList.add('show');
    document.getElementById('drawer').classList.add('show');
  }

  function closeDrawer() {
    document.getElementById('scrim').classList.remove('show');
    document.getElementById('drawer').classList.remove('show');
    drawerItemId = null;
  }

  document.getElementById('scrim').onclick = closeDrawer;
  document.getElementById('drawerClose').onclick = closeDrawer;

  // 图片弹窗
  function openImageModal(images, index) {
    currentImages = images.map(img => `${API_BASE_URL}/data/uploads/${img}`);
    currentImageIndex = index;
    updateModalImage();
    document.getElementById('imgModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeImageModal() {
    document.getElementById('imgModal').classList.remove('show');
    document.body.style.overflow = '';
  }

  function navigateImage(dir) {
    currentImageIndex += dir;
    if (currentImageIndex < 0) currentImageIndex = currentImages.length - 1;
    if (currentImageIndex >= currentImages.length) currentImageIndex = 0;
    updateModalImage();
  }

  function updateModalImage() {
    document.getElementById('modalImage').src = currentImages[currentImageIndex];
    document.getElementById('imgCounter').textContent = `${currentImageIndex + 1} / ${currentImages.length}`;
  }

  document.getElementById('imgModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeImageModal(); });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('imgModal').classList.contains('show')) return;
    if (e.key === 'Escape') closeImageModal();
    if (e.key === 'ArrowLeft') navigateImage(-1);
    if (e.key === 'ArrowRight') navigateImage(1);
  });

  // 退出
  function logout() { localStorage.removeItem(PASSWORD_KEY); location.reload(); }

  // 导出
  async function exportToExcel() {
    const password = localStorage.getItem(PASSWORD_KEY);
    try {
      let url = `${API_BASE_URL}/api/feedback/export?`;
      if (currentTypeFilter !== 'all') url += `issue_type=${encodeURIComponent(currentTypeFilter)}&`;
      if (currentStatusFilter !== 'all') url += `status=${encodeURIComponent(currentStatusFilter)}&`;
      if (currentSpaceFilter !== 'all') url += `space=${encodeURIComponent(currentSpaceFilter)}&`;
      const startDate = document.getElementById('startDate')?.value;
      const endDate = document.getElementById('endDate')?.value;
      if (startDate) url += `start_date=${encodeURIComponent(startDate)}&`;
      if (endDate) url += `end_date=${encodeURIComponent(endDate)}&`;

      const response = await fetch(url, { headers: { 'Admin-Password': password } });
      if (!response.ok) {
        if (response.status === 401) { alert('密码已过期'); localStorage.removeItem(PASSWORD_KEY); location.reload(); }
        else alert('导出失败');
        return;
      }
      const disposition = response.headers.get('Content-Disposition');
      let filename = 'feedback_export.csv';
      if (disposition) { const m = disposition.match(/filename="(.+)"/); if (m) filename = m[1]; }
      const blob = await response.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    } catch (error) {
      alert('导出失败，请重试');
    }
  }
</script>
</body>
</html>
