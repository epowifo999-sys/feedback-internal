<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>贴心Claw后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   设计系统 · 柔和米白暖色 · Notion/Craft 风
   ============================================================ */
:root {
  --bg: oklch(0.985 0.006 80);
  --bg-soft: oklch(0.97 0.008 75);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.985 0.006 80);
  --surface-hover: oklch(0.965 0.008 75);
  --border: oklch(0.92 0.008 75);
  --border-strong: oklch(0.86 0.01 75);
  --divider: oklch(0.94 0.006 75);
  --ink: oklch(0.22 0.01 60);
  --ink-2: oklch(0.38 0.01 60);
  --ink-3: oklch(0.56 0.008 60);
  --ink-4: oklch(0.72 0.006 60);
  --brand: oklch(0.62 0.14 42);
  --brand-hover: oklch(0.56 0.15 42);
  --brand-soft: oklch(0.96 0.03 50);
  --brand-ink: oklch(0.42 0.13 42);
  --info: oklch(0.58 0.11 240);
  --info-soft: oklch(0.96 0.025 240);
  --success: oklch(0.58 0.11 155);
  --success-soft: oklch(0.96 0.03 155);
  --warn: oklch(0.68 0.13 75);
  --warn-soft: oklch(0.96 0.04 80);
  --danger: oklch(0.6 0.16 25);
  --danger-soft: oklch(0.96 0.03 25);
  --purple: oklch(0.58 0.12 300);
  --purple-soft: oklch(0.96 0.025 300);
  --font-sans: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Source Serif 4", "Source Serif Pro", "Noto Serif SC", "Songti SC", Georgia, serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 30px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --r-2xl: 22px;
  --shadow-xs: 0 1px 2px oklch(0.2 0.02 60 / 0.04);
  --shadow-sm: 0 1px 3px oklch(0.2 0.02 60 / 0.05), 0 1px 2px oklch(0.2 0.02 60 / 0.03);
  --shadow-md: 0 4px 16px oklch(0.2 0.02 60 / 0.06), 0 1px 3px oklch(0.2 0.02 60 / 0.04);
  --shadow-lg: 0 12px 32px oklch(0.2 0.02 60 / 0.08), 0 4px 12px oklch(0.2 0.02 60 / 0.05);
  --shadow-xl: 0 24px 48px oklch(0.2 0.02 60 / 0.12), 0 8px 16px oklch(0.2 0.02 60 / 0.06);
  --focus-ring: 0 0 0 3px oklch(0.62 0.14 42 / 0.2);
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 140ms;
  --dur: 220ms;
  --dur-slow: 360ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: var(--text-base);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button { font-family: inherit; }
::selection { background: oklch(0.62 0.14 42 / 0.2); color: var(--ink); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: oklch(0.86 0.01 75); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.012 75); }
::-webkit-scrollbar-track { background: transparent; }

body { min-height: 100vh; display: flex; flex-direction: column; }

/* ---------- 整体布局 ---------- */
.app-layout {
  display: flex; flex: 1; min-height: 0;
}

/* ---------- 侧边导航 ---------- */
.sidebar {
  width: 220px;
  min-height: calc(100vh - 53px);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width var(--dur-slow) var(--ease-out);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.sidebar.collapsed { width: 52px; }

/* 悬浮折叠按钮 */
.sidebar-toggle-float {
  position: absolute;
  top: 16px;
  right: -13px;
  z-index: 20;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease);
}
.sidebar:hover .sidebar-toggle-float,
.sidebar-toggle-float:hover {
  opacity: 1;
  pointer-events: auto;
}
.toggle-float-btn {
  width: 26px; height: 26px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-md);
  color: var(--ink-3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--dur) var(--ease);
  position: relative;
}
.toggle-float-btn:hover { background: var(--surface-hover); color: var(--ink); border-color: var(--border-strong); }
.toggle-float-btn svg { width: 13px; height: 13px; transition: transform var(--dur-slow) var(--ease-out); }
.sidebar.collapsed .toggle-float-btn svg { transform: rotate(180deg); }

/* Tooltip */
.toggle-float-btn::after {
  content: attr(data-tip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%; transform: translateY(-50%);
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: var(--r-sm);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  font-family: var(--font-sans);
}
.toggle-float-btn:hover::after { opacity: 1; }

.sidebar-nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  font-size: 13.5px; color: var(--ink-2);
  transition: all var(--dur) var(--ease);
  white-space: nowrap; overflow: hidden;
  border: 0; background: transparent; font-family: inherit;
  width: 100%; text-align: left;
}
.nav-item:hover { background: var(--surface-hover); color: var(--ink); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-ink); font-weight: 500; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-item .nav-label { transition: opacity var(--dur) var(--ease); opacity: 1; }
.sidebar.collapsed .nav-item .nav-label { opacity: 0; width: 0; overflow: hidden; }

/* ---------- 主内容区 ---------- */
.main-area { flex: 1; min-width: 0; overflow-x: auto; }

/* ---------- 顶部 ---------- */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 28px;
  display: flex; align-items: center; gap: 18px;
  position: sticky; top: 0; z-index: 20;
}
.brand {
  display: flex; align-items: center; gap: 10px;
}
.brand .logo {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--brand), oklch(0.6 0.16 25));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 13px;
}
.brand .nm { font-family: var(--font-serif); font-size: 15px; font-weight: 600; color: var(--ink); }
.topbar .crumbs {
  font-size: 13px; color: var(--ink-3);
  display: flex; align-items: center; gap: 6px;
}
.topbar .crumbs .here { color: var(--ink); font-weight: 500; }
.topbar .crumbs .sep { color: var(--ink-4); }
.topbar .spacer { flex: 1; }
.topbar .logout-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  color: var(--ink-2);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.topbar .logout-btn:hover { background: var(--surface-hover); color: var(--ink); border-color: var(--border-strong); }

/* ---------- KPI ---------- */
.kpi-strip {
  padding: 22px 28px 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px 18px 14px;
  display: flex; flex-direction: column; gap: 6px;
  position: relative;
  min-height: 90px;
}
.kpi-card .lbl { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.kpi-card .row { display: flex; align-items: baseline; gap: 8px; }
.kpi-card .val { font-family: var(--font-serif); font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1.1; }
.kpi-card .delta {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 4px;
}
.kpi-card .delta.up { color: oklch(0.42 0.12 155); background: var(--success-soft); }
.kpi-card .delta.down { color: var(--danger); background: var(--danger-soft); }
.kpi-card .hint { font-size: 11.5px; color: var(--ink-4); margin-top: 0px; }
.kpi-card .spark-wrap {
  position: absolute; right: 12px; bottom: 8px;
  width: 56px; height: 20px; opacity: 0.45;
}
.kpi-card .spark-wrap canvas { width: 100%; height: 100%; }

/* ---------- 主面板 ---------- */
.panel {
  margin: 18px 28px 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
}

/* 工具栏 */
.ptool {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--divider);
  flex-wrap: wrap;
}
.search {
  flex: 1; min-width: 180px; max-width: 360px;
  position: relative;
}
.search input {
  width: 100%;
  padding: 7px 12px 7px 30px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg-soft);
  font-family: inherit; font-size: 13px; color: var(--ink);
}
.search input:focus { outline: 0; border-color: var(--brand); box-shadow: var(--focus-ring); background: var(--surface); }
.search input::placeholder { color: var(--ink-4); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-4); width: 13px; height: 13px; }

.seg-filter {
  display: inline-flex;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 2px;
  gap: 1px;
}
.seg-filter button {
  padding: 5px 11px;
  border: 0; background: transparent;
  font-size: 12px; color: var(--ink-2);
  cursor: pointer; border-radius: 5px; font-family: inherit;
  display: inline-flex; align-items: center; gap: 4px;
  transition: all var(--dur) var(--ease);
}
.seg-filter button:hover { color: var(--ink); }
.seg-filter button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); font-weight: 500; }
.seg-filter button .n { font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.seg-filter button.active .n { color: var(--brand-ink); }

.icon-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--r-md);
  color: var(--ink-3);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surface-hover); color: var(--ink); }
.icon-btn svg { width: 14px; height: 14px; }

.tool-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.count-lbl { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table.tbl {
  width: 100%;
  table-layout: fixed;
  border-collapse: separate; border-spacing: 0;
  font-size: 13px;
}
.tbl thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.tbl tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--divider);
  vertical-align: middle;
}
.tbl tbody tr {
  cursor: pointer;
  transition: background var(--dur) var(--ease);
}
.tbl tbody tr:hover { background: var(--bg-soft); }
.tbl tbody tr.selected { background: var(--brand-soft); }
.tbl tbody tr:last-child td { border-bottom: 0; }

.ck {
  width: 16px; height: 16px;
  border: 1.5px solid var(--border-strong);
  border-radius: 4px;
  background: var(--surface);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  vertical-align: middle;
  transition: all var(--dur) var(--ease);
}
.ck:hover { border-color: var(--brand); }
.ck.checked { background: var(--brand); border-color: var(--brand); }
.ck.checked::after {
  content: ""; width: 7px; height: 4px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: translateY(-1px) rotate(-45deg);
}

.id-col { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }

.type-tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 5px;
  font-size: 11.5px; font-weight: 500;
  white-space: nowrap;
}
.type-tag::before { content:""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.type-tag.inaccurate { background: var(--purple-soft); color: oklch(0.45 0.14 300); }
.type-tag.bug { background: var(--danger-soft); color: var(--danger); }
.type-tag.suggest { background: var(--success-soft); color: oklch(0.42 0.12 155); }
.type-tag.demand { background: var(--warn-soft); color: oklch(0.45 0.13 75); }
.type-tag.other { background: var(--surface-2); color: var(--ink-3); }

.space-tag {
  padding: 2px 7px; border-radius: 4px;
  background: var(--info-soft); color: oklch(0.42 0.11 240);
  font-size: 11.5px; font-weight: 500; white-space: nowrap;
}

.desc-cell {
  color: var(--ink);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.desc-cell .imgs-inline {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 6px; background: var(--surface-2);
  border-radius: 4px; font-size: 10.5px; color: var(--ink-3);
  margin-left: 6px; vertical-align: middle;
  font-variant-numeric: tabular-nums;
}
.desc-cell .imgs-inline svg { width: 10px; height: 10px; }

.user-cell {
  display: flex; align-items: center; gap: 8px;
  white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.user-cell .av {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.75 0.08 180), oklch(0.55 0.12 220));
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 600;
}
.user-cell .u-contact { font-size: 11px; color: var(--ink-4); margin-top: 1px; }

.time-cell { color: var(--ink-3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* 状态下拉 */
.status-sel {
  position: relative; display: inline-block;
}
.status-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border: 1px solid transparent;
  border-radius: var(--r-sm); cursor: pointer;
  font-size: 12px; font-weight: 500;
  font-family: inherit;
  background: transparent;
  transition: all var(--dur) var(--ease);
  white-space: nowrap;
}
.status-btn::before { content:""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.status-btn svg { width: 10px; height: 10px; color: var(--ink-4); margin-left: 2px; }
.status-btn:hover { filter: brightness(0.95); }
.status-btn.collecting { color: oklch(0.38 0.11 240); background: var(--info-soft); border-color: oklch(0.82 0.06 240); }
.status-btn.resolving { color: oklch(0.42 0.13 75); background: var(--warn-soft); border-color: oklch(0.84 0.08 75); }
.status-btn.resolved { color: oklch(0.36 0.12 155); background: var(--success-soft); border-color: oklch(0.82 0.07 155); }
.status-menu {
  position: absolute; top: calc(100% + 4px); left: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 4px;
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 10;
  min-width: 130px;
}
.status-sel.open .status-menu { display: block; }
.status-menu .opt {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 5px;
  font-size: 12px; color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--dur) var(--ease);
}
.status-menu .opt:hover { background: var(--bg-soft); color: var(--ink); }
.status-menu .opt .d { width: 7px; height: 7px; border-radius: 50%; }

.row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity var(--dur) var(--ease); }
.tbl tbody tr:hover .row-actions { opacity: 1; }
.row-actions .ra {
  width: 24px; height: 24px; border: 0;
  background: transparent; cursor: pointer;
  border-radius: 5px; color: var(--ink-3);
  display: inline-flex; align-items: center; justify-content: center;
}
.row-actions .ra:hover { background: var(--surface-2); color: var(--ink); }
.row-actions .ra svg { width: 13px; height: 13px; }

/* 分页 */
.paginate {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  border-top: 1px solid var(--divider);
  font-size: 12.5px;
  color: var(--ink-3);
}
.pager {
  display: flex; align-items: center; gap: 2px;
}
.pager button {
  min-width: 28px; height: 28px; padding: 0 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
  font-size: 12px; color: var(--ink-2);
  cursor: pointer;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  transition: all var(--dur) var(--ease);
}
.pager button:hover { background: var(--bg-soft); }
.pager button.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pager button:disabled { opacity: 0.5; cursor: not-allowed; }

/* 骨架屏 */
@keyframes shim {
  0% { background-position: -200px 0; }
  100% { background-position: calc(200px + 100%) 0; }
}
.skel-bar {
  height: 12px; border-radius: 4px;
  background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-hover) 50%, var(--surface-2) 100%);
  background-size: 200px 100%;
  animation: shim 1.4s infinite linear;
}

/* 批量栏 */
.batch-bar {
  position: fixed;
  bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120%);
  background: var(--ink); color: oklch(0.96 0.005 75);
  padding: 10px 14px 10px 18px;
  border-radius: 12px;
  display: flex; align-items: center; gap: 14px;
  font-size: 13px;
  box-shadow: var(--shadow-xl);
  z-index: 30;
  transition: transform var(--dur-slow) var(--ease-out);
  visibility: hidden;
}
.batch-bar.show { transform: translateX(-50%) translateY(0); visibility: visible; }
.batch-bar .cnt { background: var(--brand); color: #fff; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.batch-bar .sep { width: 1px; height: 16px; background: oklch(1 0 0 / 0.15); }
.batch-bar button {
  background: transparent; border: 0; color: inherit;
  font-size: 12.5px; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 6px;
}
.batch-bar button:hover { background: oklch(1 0 0 / 0.08); }
.batch-bar button svg { width: 13px; height: 13px; }

/* 抽屉 */
.drawer-scrim {
  position: fixed; inset: 0;
  background: oklch(0.2 0.02 60 / 0.35);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  z-index: 40;
}
.drawer-scrim.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0;
  width: 480px; max-width: 92vw;
  height: 100vh; background: var(--surface);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform var(--dur-slow) var(--ease-out);
  z-index: 50;
  display: flex; flex-direction: column;
}
.drawer.show { transform: translateX(0); }
.drawer-head {
  padding: 16px 22px;
  display: flex; align-items: center; gap: 10px;

}
.drawer-head .close {
  width: 28px; height: 28px; border-radius: 8px;

}
.drawer-head .close:hover { background: var(--surface-hover); color: var(--ink); }

.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field .flabel { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }

/* Info grid layout */
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-item { display: flex; flex-direction: column; gap: 4px; }
.info-item .label { font-size: 11px; color: var(--ink-4); }
.info-item .value { font-size: 13px; color: var(--ink); font-weight: 500; }
.submitter-row { display: flex; align-items: center; gap: 10px; }
.submitter-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, oklch(0.7 0.12 180), oklch(0.55 0.14 220));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; flex-shrink: 0;
}
.submitter-name { font-size: 13px; font-weight: 500; }
.submitter-id { font-size: 11px; color: var(--ink-4); }
.device-info {
  font-size: 12px; color: var(--ink-3); font-family: var(--font-mono);
  background: var(--bg); padding: 10px 12px; border-radius: var(--r-sm);
  word-break: break-all; line-height: 1.6;
}
.desc-block {
  padding: 14px; background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: var(--r-md);
  font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
.drawer-images {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.drawer-images img {
  width: 80px; height: 80px; object-fit: cover;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform var(--dur) var(--ease);
}
.drawer-images img:hover { transform: scale(1.05); }
.drawer-foot { padding: 12px 22px; border-top: 1px solid var(--divider); display: flex; gap: 8px; }

/* Timeline */
.timeline-section { margin-top: 8px; }
.timeline-section .ttl { font-family: var(--font-serif); font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
.timeline { position: relative; }
.timeline-empty {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px; padding: 24px 0 8px; color: var(--ink-4);
}
.timeline-empty-icon { font-size: 28px; opacity: 0.4; }
.timeline-empty-text { font-size: 13px; }
.timeline-item { display: flex; gap: 12px; padding: 12px 0; position: relative; }
.timeline-item:not(:last-child)::after {
  content: ''; position: absolute; left: 12px; top: 42px; bottom: 0;
  width: 1px; background: var(--border);
}
.timeline-avatar-wrap { flex-shrink: 0; padding-top: 2px; }
.timeline-avatar-sm {
  width: 26px; height: 26px; border-radius: 50%;
  background: oklch(0.6 0.13 180); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
}
.timeline-content { flex: 1; min-width: 0; }
.timeline-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.timeline-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.timeline-action { font-size: 12px; color: var(--ink-3); }
.timeline-time { margin-left: auto; font-size: 11px; color: var(--ink-4); flex-shrink: 0; }
.timeline-status-change {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 500;
}
.timeline-status-change.solving { background: oklch(0.96 0.06 85); color: oklch(0.55 0.13 85); }
.timeline-status-change.done { background: oklch(0.96 0.06 145); color: oklch(0.5 0.13 155); }
.timeline-status-change.collecting { background: oklch(0.95 0.05 240); color: oklch(0.55 0.11 240); }
.timeline-bubble {
  background: var(--bg); border-radius: var(--r-md);
  padding: 10px 12px; font-size: 13px; line-height: 1.6;
  color: var(--ink); margin-bottom: 8px; white-space: pre-wrap; word-break: break-word;
}
.timeline-images { display: flex; flex-wrap: wrap; gap: 8px; }
.timeline-images img,
.timeline-images .img-thumb {
  width: 72px; height: 72px; object-fit: cover; border-radius: var(--r-sm);
  border: 1px solid var(--border); cursor: pointer; transition: transform var(--dur) var(--ease);
}
.timeline-images img:hover,
.timeline-images .img-thumb:hover { transform: scale(1.04); }

/* Comment input */
.comment-box {
  border: 1.5px solid var(--border); border-radius: var(--r-lg);
  overflow: hidden; background: var(--surface);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.comment-box:focus-within {
  border-color: var(--brand);

}
.comment-textarea {
  width: 100%; border: none; outline: none; resize: none;

}
.comment-textarea::placeholder { color: var(--ink-4); }
.comment-toolbar {

}
.comment-toolbar-left { display: flex; align-items: center; gap: 4px; }
.comment-upload {
  display: inline-flex; align-items: center; gap: 5px;

.comment-upload:hover { background: var(--border); color: var(--ink); }
.comment-upload svg { width: 13px; height: 13px; flex-shrink: 0; }
.comment-preview { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
.comment-preview .thumb {

}
.comment-preview .thumb img { width: 100%; height: 100%; object-fit: cover; }
.comment-preview .thumb .x {
  position: absolute; top: 0; right: 0; width: 16px; height: 16px;
  background: oklch(0 0 0 / 0.5); color: #fff; border: 0;
  border-radius: 0 0 0 6px; cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}
.comment-submit-btn {
  padding: 6px 16px; border-radius: var(--r-sm); border: none;
  background: var(--brand); color: #fff;

}
.comment-submit-btn:hover { background: var(--brand-hover); }
.comment-submit-btn:active { transform: scale(0.97); }
.comment-submit-btn:disabled {
  background: var(--border); color: var(--ink-4); cursor: not-allowed;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 16px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
  font-size: var(--text-base); font-weight: 500;
  cursor: pointer; transition: all var(--dur) var(--ease);

}
.btn:active { transform: scale(0.985); }
.btn-primary {

}
.btn-primary:hover { background: var(--brand-hover); }
.btn-ghost {
  background: transparent; color: var(--ink-2);
  border-color: var(--border);
}
.btn-ghost:hover { background: var(--surface-hover); border-color: var(--border-strong); color: var(--ink); }
.drawer-foot .btn { flex: 1; padding: 9px 14px; font-size: 12.5px; }

/* 图片放大弹窗 */
.img-modal {
  position: fixed; inset: 0;

  color: #fff; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.img-modal .close-btn:hover { background: oklch(1 0 0 / 0.25); }
.img-modal .nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);

.img-modal .nav-btn:hover { background: oklch(1 0 0 / 0.25); }
.img-modal .nav-btn.prev { left: 20px; }
.img-modal .nav-btn.next { right: 20px; }
.img-modal .img-counter {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);

  background: oklch(0 0 0 / 0.5);

/* 加载状态 */
.loading-state { padding: 40px; text-align: center; color: var(--ink-4); }

@media (max-width: 960px) {

  .topbar { padding: 12px 16px; }
  .panel { margin: 14px 16px 16px; }
  .kpi-strip { padding: 16px 16px 0; }
}

<!-- 登录遮罩 -->

<script>

  // 用户部门查询配置

  const USER_ACCESS_TOKEN = ''; // 填入 UIC 接口 access token

  // 部门缓存：{ searchKey: '部门字符串' }
  const deptCache = {};

  let currentPage = 1;
  let currentTypeFilter = 'all';

  // 绘制迷你折线图
  function drawSparkline(canvasId, data, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !data.length) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const w = rect.width;
    const h = rect.height;

    const max = Math.max(...data, 1);
    const min = Math.min(...data, 0);
    const range = max - min || 1;
    const pad = 2;

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = color;
    ctx.lineWidth = 0.8;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();

    data.forEach((v, i) => {
      const x = pad + (i / (data.length - 1)) * (w - pad * 2);
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  // 加载统计
  async function loadStats() {
    try {
      const [overviewRes, trendRes] = await Promise.all([
        fetch(`${API_BASE_URL}/api/stats/overview`, { credentials: 'include' }),
        fetch(`${API_BASE_URL}/api/stats/weekly-trend`, { credentials: 'include' })
      ]);

      const overview = await overviewRes.json();
      const trendData = trendRes.ok ? await trendRes.json() : { trend: [] };

      if (overview.success) {
        // 总反馈 — 显示差值
        document.getElementById('kpiTotal').textContent = overview.total.value;
        setDeltaAbs('kpiDeltaTotal', overview.total.delta);

        // 本周新增 — 显示差值
        document.getElementById('kpiNew').textContent = overview.new_count.value;
        setDeltaAbs('kpiDeltaNew', overview.new_count.delta);

        // 待处理 — 显示差值
        document.getElementById('kpiPending').textContent = overview.pending.value;
        setDeltaAbs('kpiDeltaPending', overview.pending.delta);

        // 已解决 — 显示差值
        document.getElementById('kpiResolved').textContent = overview.resolved.value;
        setDeltaAbs('kpiDeltaResolved', overview.resolved.delta);
      }

      // 处理本周新增副文字 + 绘制折线图
      if (trendData.success && trendData.trend.length) {
        const trend = trendData.trend;

        // 本周（最后一周，可能未满7天）的单日最高新增
        const now = new Date();
        const dayOfWeek = now.getDay() || 7;
        const thisWeekDays = trend.slice(-dayOfWeek);
        const dailyNewCounts = thisWeekDays.map(d => d.new_count);
        const maxDailyNew = Math.max(...dailyNewCounts);
        if (overview.new_count.value > 0) {
          document.getElementById('kpiHintNew').textContent = `单日最高 ${maxDailyNew} 条`;
        } else {
          document.getElementById('kpiHintNew').textContent = '暂无数据';
        }

        // 按周分组（4周，每组7天）
        const weeks = [];
        for (let i = 0; i < 4; i++) {
          const slice = trend.slice(i * 7, i * 7 + 7);
          weeks.push({
            new_count: slice.reduce((s, d) => s + d.new_count, 0),
            pending: slice.reduce((s, d) => s + d.pending, 0),
            resolved: slice.reduce((s, d) => s + d.resolved, 0)
          });
        }

        // 总反馈趋势：累计值
        let cumulative = 0;
        const totalWeeks = weeks.map(w => { cumulative += w.new_count; return cumulative; });

        drawSparkline('sparkTotal', totalWeeks, 'oklch(0.55 0.13 75)');
        drawSparkline('sparkNew', weeks.map(w => w.new_count), 'oklch(0.42 0.12 155)');
        drawSparkline('sparkPending', weeks.map(w => w.pending), 'oklch(0.65 0.15 25)');
        drawSparkline('sparkResolved', weeks.map(w => w.resolved), 'oklch(0.42 0.12 155)');
      }
    } catch (error) {
      console.error('加载统计失败:', error);
    }
  }

  // 环比：显示绝对差值
  function setDeltaAbs(elId, delta) {
    const el = document.getElementById(elId);
    if (!el) return;
    if (delta === 0) {
      el.textContent = '暂无对比数据';
      el.className = 'delta';
      el.style.color = 'var(--ink-4)';
      el.style.background = 'transparent';
      return;
    }
    const isUp = delta > 0;
    const arrow = isUp ? '↑' : '↓';
    el.textContent = `${arrow} ${Math.abs(delta)}`;
    el.className = `delta ${isUp ? 'up' : 'down'}`;
    el.style = '';
  }

  function getTypeClass(type) {

    return map[type] || 'other';

  function formatDateTime(dateStr) {
    const d = new Date(dateStr);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function formatShortTime(dateStr) {
    const d = new Date(dateStr);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function parseUserName(raw) {
    if (!raw) return { name: '匿名', employeeNo: '', display: '匿名', initial: '匿' };
    const m = raw.match(/^(.+?)（(\d+)）$/);
    if (m) return { name: m[1], employeeNo: m[2], display: `${m[1]}（${m[2]}）`, initial: m[1][0] };
    return { name: raw, employeeNo: '', display: raw, initial: raw[0] };
  }

  // 查询单个用户的部门信息（带缓存）
  async function fetchDepartment(searchKey) {
    if (!searchKey || searchKey === '匿名') return null;
    if (deptCache[searchKey] !== undefined) return deptCache[searchKey];

    try {
      const encodedKey = encodeURIComponent(searchKey);
      const url = `${UIC_API_BASE}?searchKey=${encodedKey}`;
      const headers = {};
      if (USER_ACCESS_TOKEN) headers['Authorization'] = USER_ACCESS_TOKEN;

      const resp = await fetch(url, { headers });
      if (!resp.ok) { deptCache[searchKey] = null; return null; }

      const json = await resp.json();
      const members = json?.data?.members;
      if (!members || members.length === 0) { deptCache[searchKey] = null; return null; }

      const depts = members[0].departments;
      if (!depts || depts.length === 0) { deptCache[searchKey] = null; return null; }

      const deptStr = depts.map(d => d.departmentName).join(' / ');
      deptCache[searchKey] = deptStr;
      return deptStr;
    } catch {
      deptCache[searchKey] = null;
      return null;
    }
  }

  // 获取部门显示文本（直接使用服务端返回的 department 字段）
  function getDeptDisplay(item) {
    return item.department || '—';
  }

  // 批量获取列表中所有用户的部门信息
  async function fetchDepartmentsForList(list) {
    const keys = new Set();
    list.forEach(item => {
      const u = parseUserName(item.user_name);
      // 优先用工号查，其次用姓名
      if (u.employeeNo) keys.add(u.employeeNo);
      else if (u.name && u.name !== '匿名') keys.add(u.name);
    });
    const promises = [...keys].map(k => fetchDepartment(k));
    await Promise.allSettled(promises);
  }

  // 分页
  function renderPagination(totalPages, total) {
    const el = document.getElementById('paginate');
    if (totalPages <= 1) { el.innerHTML = `<span>共 ${total} 条</span><div></div>`; return; }
    let pages = [];
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
        pages.push(i);
      } else if (pages[pages.length-1] !== '...') {
        pages.push('...');
      }
    }
    el.innerHTML = `
      <span>共 ${total} 条 · 每页 15 条</span>
      <div class="pager">
        <button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage-1})">‹</button>
        ${pages.map(p => p === '...' ? '<button disabled>…</button>' : `<button class="${p===currentPage?'active':''}" onclick="goToPage(${p})">${p}</button>`).join('')}
        <button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage+1})">›</button>
      </div>`;
  }

          body: fd
        });
        const uploadResult = await uploadResp.json();
        if (uploadResult.success && uploadResult.filename) {
          imagePaths.push(uploadResult.filename);
        }
      }

      const resp = await fetch(`${API_BASE_URL}/api/feedbacks/${feedbackId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          content,
          images: imagePaths,
          user_name: '管理员'
        })
      });
      const result = await resp.json();
      if (result.success) {
        input.value = '';
        commentFiles = [];
        document.getElementById('commentPreview').innerHTML = '';
        const sb = document.getElementById('commentSubmitBtn');
        if (sb) sb.disabled = true;
        loadComments(feedbackId);
      } else {
        showToast(result.message || '提交失败', 'error');
      }
    } catch (error) {
      showToast('提交失败，请重试', 'error');
    }

    btn.textContent = '提交';
    btn.disabled = false;
  }

  // 评论图片上传处理
  function initCommentUpload() {
    const fileInput = document.getElementById('commentFileInput');
    const uploadBtn = document.getElementById('commentUploadBtn');
    const preview = document.getElementById('commentPreview');
    if (!uploadBtn) return;

    uploadBtn.onclick = () => fileInput?.click();
    fileInput.onchange = () => {
      const files = Array.from(fileInput.files);
      for (const f of files) {
        if (!f.type.startsWith('image/')) continue;
        if (commentFiles.length >= 3) break;
        commentFiles.push(f);
      }
      renderCommentThumbs();
      fileInput.value = '';
    };

    window.renderCommentThumbs = function() {
      preview.innerHTML = '';
      commentFiles.forEach((f, i) => {
        const r = new FileReader();
        r.onload = e => {
          const div = document.createElement('div');
          div.className = 'thumb';
          div.innerHTML = `<img src="${e.target.result}" /><button class="x" type="button">×</button>`;
          div.querySelector('.x').onclick = () => { commentFiles.splice(i, 1); renderCommentThumbs(); if (window.updateCommentSubmitState) window.updateCommentSubmitState(); };
          preview.appendChild(div);
        };
        r.readAsDataURL(f);
      });
      if (window.updateCommentSubmitState) window.updateCommentSubmitState();
    };
  }

  // 抽屉
  function openDrawer(id) {
    drawerItemId = id;
    const item = feedbackList.find(f => f.id === id);
    if (!item) return;
    const s = STATUS_META[item.status] || STATUS_META['收集中'];
    const tc = getTypeClass(item.issue_type);
    const initial = parseUserName(item.user_name).initial;
    const dept = getDeptDisplay(item);
    const statusCls = { '收集中': 'collecting', '解决中': 'solving', '已解决': 'done' };
    const sc = statusCls[item.status] || 'collecting';

    document.getElementById('drawerId').textContent = '#' + String(item.id).padStart(4,'0');
    document.getElementById('drawerBody').innerHTML = `
      <!-- Meta bar -->
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <span class="type-tag ${tc}">${escapeHtml(item.issue_type)}</span>
        ${item.space ? `<span class="space-tag">${escapeHtml(item.space)}</span>` : ''}
        <span style="font-size:12px; color:var(--ink-4); margin-left:auto; font-family:var(--font-mono);">${formatDateTime(item.created_at)}</span>
      </div>
      <!-- Description -->
      <div class="field">
        <span class="flabel">问题描述</span>
        <div class="desc-block">${escapeHtml(item.description)}</div>
      </div>
      ${item.images && item.images.length ? `
      <div class="field">
        <span class="flabel">附件图片</span>
        <div class="drawer-images">
          ${item.images.map((img,i) => `<img src="${API_BASE_URL}/data/uploads/${img}" onclick="openImageModal(${JSON.stringify(item.images).replace(/"/g,'&quot;')}, ${i})" />`).join('')}
        </div>
      </div>` : ''}
      <!-- Info grid -->
      <div class="field">
        <span class="flabel">基本信息</span>
        <div class="info-grid">
          <div class="info-item">
            <span class="label">提交人</span>
            <div class="submitter-row">
              <div class="submitter-avatar">${escapeHtml(initial)}</div>
              <div>
                <div class="submitter-name">${escapeHtml(parseUserName(item.user_name).display)}</div>
                ${item.contact ? `<div class="submitter-id">${escapeHtml(item.contact)}</div>` : ''}
              </div>
            </div>
          </div>
          <div class="info-item">
            <span class="label">所属部门</span>
            <span class="value">${escapeHtml(dept)}</span>
          </div>
          <div class="info-item">
            <span class="label">岗位</span>
            <span class="value">${item.position ? escapeHtml(item.position) : '<span style="color:var(--ink-4);">—</span>'}</span>
          </div>
          <div class="info-item">
            <span class="label">当前状态</span>
            <div class="status-sel" data-item-id="${item.id}">
              <button class="status-btn ${s.cls}" data-status-btn>${item.status || '收集中'}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="status-menu">
                <div class="opt" data-set="收集中"><span class="d" style="background:oklch(0.45 0.11 240);"></span>收集中</div>
                <div class="opt" data-set="解决中"><span class="d" style="background:oklch(0.48 0.13 75);"></span>解决中</div>
                <div class="opt" data-set="已解决"><span class="d" style="background:oklch(0.42 0.12 155);"></span>已解决</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      ${item.device_info ? `
      <div class="field">
        <span class="flabel">设备信息</span>
        <div class="device-info">${escapeHtml(item.device_info)}</div>
      </div>` : ''}
      <!-- Timeline -->
      <div class="timeline-section">
        <div class="ttl">处理记录</div>
        <div class="timeline" id="timelineContainer">
          <div class="loading-state" style="padding:12px 0;">加载中…</div>
        </div>
      </div>
      <!-- Comment card -->
      <div class="field">
        <span class="flabel">添加备注</span>
        <div class="comment-box">
          <textarea class="comment-textarea" id="commentInput" placeholder="记录处理过程、结论或补充说明…"></textarea>
          <input type="file" id="commentFileInput" accept="image/*" multiple style="display:none;" />
          <div class="comment-preview" id="commentPreview"></div>
          <div class="comment-toolbar">
            <div class="comment-toolbar-left">
              <button class="comment-upload" id="commentUploadBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                添加图片
              </button>
            </div>
            <button class="comment-submit-btn" id="commentSubmitBtn" disabled>提交</button>
          </div>
        </div>
      </div>`;

    // 状态下拉
    const sel = document.getElementById('drawerBody').querySelector('.status-sel');
    const btn = sel.querySelector('[data-status-btn]');
    btn.onclick = e => {
      e.stopPropagation();
      document.querySelectorAll('.status-sel.open').forEach(x => x !== sel && x.classList.remove('open'));
      sel.classList.toggle('open');
    };
    sel.querySelectorAll('.opt').forEach(opt => {
      opt.onclick = async e => {
        e.stopPropagation();
        const newStatus = opt.dataset.set;
        const itemId = parseInt(sel.dataset.itemId);
        await changeStatus(itemId, newStatus, sel);
        if (drawerItemId === itemId) openDrawer(itemId); // 刷新详情面板
      };
    });

    // 底部按钮
    const resolveBtn = document.getElementById('drawerResolveBtn');
    const nextStatus = { '收集中': '解决中', '解决中': '已解决' };
    const ns = nextStatus[item.status];
    if (ns) {
      resolveBtn.textContent = `标为${ns}`;
      resolveBtn.onclick = async () => { await changeStatus(item.id, ns); openDrawer(item.id); };
    } else {
      resolveBtn.textContent = '已完成';
      resolveBtn.disabled = true;
    }

    // 加载评论
    loadComments(item.id);
    initCommentUpload();

    // 评论提交
    const submitBtn = document.getElementById('commentSubmitBtn');
    const commentInput = document.getElementById('commentInput');
    submitBtn.onclick = () => submitComment(item.id);
    commentInput.oninput = () => {
      submitBtn.disabled = commentInput.value.trim() === '' && commentFiles.length === 0;
    };
    // 更新 submit 按钮状态（图片上传后也要触发）
    window.updateCommentSubmitState = function() {
      submitBtn.disabled = commentInput.value.trim() === '' && commentFiles.length === 0;
    };

    document.getElementById('scrim').classList.add('show');
    document.getElementById('drawer').classList.add('show');
  }

  function closeDrawer() {
    commentFiles = [];
    drawerItemId = null;
    document.getElementById('scrim').classList.remove('show');
    document.getElementById('drawer').classList.remove('show');
  }

  document.getElementById('scrim').onclick = closeDrawer;
  document.getElementById('drawerClose').onclick = closeDrawer;

  // 图片弹窗
  function openImageModal(images, index) {
    currentImages = images.map(img => `${API_BASE_URL}/data/uploads/${img}`);
    currentImageIndex = index;
    updateModalImage();
    document.getElementById('imgModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeImageModal() {
    document.getElementById('imgModal').classList.remove('show');
    document.body.style.overflow = '';
  }

  function navigateImage(dir) {
    currentImageIndex += dir;
    if (currentImageIndex < 0) currentImageIndex = currentImages.length - 1;
    if (currentImageIndex >= currentImages.length) currentImageIndex = 0;
    updateModalImage();
  }

  function updateModalImage() {
    document.getElementById('modalImage').src = currentImages[currentImageIndex];
    document.getElementById('imgCounter').textContent = `${currentImageIndex + 1} / ${currentImages.length}`;
  }

  document.getElementById('imgModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeImageModal(); });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('imgModal').classList.contains('show')) return;
    if (e.key === 'Escape') closeImageModal();
    if (e.key === 'ArrowLeft') navigateImage(-1);
    if (e.key === 'ArrowRight') navigateImage(1);
  });

  // 侧边栏展开/收起
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const btn = document.getElementById('toggleFloatBtn');
    sidebar.classList.toggle('collapsed');
    const isCollapsed = sidebar.classList.contains('collapsed');
    btn.setAttribute('data-tip', isCollapsed ? '展开导航' : '收起导航');
  }

  // 导航：用户反馈中心
  function navFeedback() {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('breadcrumb').textContent = '用户反馈中心';
  }

  // 导航：虾点子配置
  function navShrimp() {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById('breadcrumb').textContent = '虾点子配置';
    showToast('还未上线，敬请期待 🦞');
    setTimeout(() => {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector('.nav-item').classList.add('active');
      document.getElementById('breadcrumb').textContent = '用户反馈中心';
    }, 2000);
  }

  // Toast 提示
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translate(-50%, -50%) scale(1)';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translate(-50%, -50%) scale(0.9)';
    }, 2500);
  }

  // 导出
  async function exportToExcel() {
    try {
      let url = `${API_BASE_URL}/api/feedback/export?`;
      if (currentTypeFilter !== 'all') url += `issue_type=${encodeURIComponent(currentTypeFilter)}&`;
      if (currentStatusFilter !== 'all') url += `status=${encodeURIComponent(currentStatusFilter)}&`;
      if (currentSpaceFilter !== 'all') url += `space=${encodeURIComponent(currentSpaceFilter)}&`;
      const keyword = document.getElementById('searchInput').value.trim();
      if (keyword) url += `keyword=${encodeURIComponent(keyword)}&`;
      const startDate = document.getElementById('startDate')?.value;
      const endDate = document.getElementById('endDate')?.value;
      if (startDate) url += `start_date=${encodeURIComponent(startDate)}&`;
      if (endDate) url += `end_date=${encodeURIComponent(endDate)}&`;

      const response = await fetch(url, { credentials: 'include' });
      if (!response.ok) {
        if (response.status === 401) { alert('会话已过期，请重新登录'); location.reload(); }
        else alert('导出失败');
        return;
      }
      const disposition = response.headers.get('Content-Disposition');
      let filename = 'feedback_export.csv';
      if (disposition) { const m = disposition.match(/filename="(.+)"/); if (m) filename = m[1]; }
      const blob = await response.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    } catch (error) {
      alert('导出失败，请重试');
    }
  }
</script>
