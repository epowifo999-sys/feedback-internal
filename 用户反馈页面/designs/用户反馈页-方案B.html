<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>用户反馈 · 方案B</title>
<link rel="stylesheet" href="tokens.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet" />
<style>
  body { min-height: 100vh; background: var(--bg); }
  .shell {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* 顶部栏 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--divider);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar .back {
    width: 32px; height: 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink-2);
  }
  .topbar .back:hover { background: var(--surface-hover); }
  .topbar .title {
    font-size: var(--text-md);
    font-weight: 600;
    color: var(--ink);
  }
  .topbar .step-pill {
    font-size: 11px;
    color: var(--ink-3);
    background: var(--surface-2);
    padding: 3px 9px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }

  /* 进度条 */
  .progress {
    height: 3px;
    background: var(--divider);
    position: relative;
  }
  .progress .bar {
    position: absolute; inset: 0 auto 0 0;
    background: var(--brand);
    transition: width var(--dur-slow) var(--ease-out);
    border-radius: 0 2px 2px 0;
  }

  /* 步骤容器 */
  .stage {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  .step {
    position: absolute; inset: 0;
    padding: 28px 22px 20px;
    overflow-y: auto;
    opacity: 0;
    transform: translateX(20px);
    transition: all var(--dur-slow) var(--ease-out);
    pointer-events: none;
  }
  .step.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .step.prev { transform: translateX(-20px); }

  .step-head {
    margin-bottom: 22px;
  }
  .step-head .kicker {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--brand-ink);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .step-head h2 {
    font-family: var(--font-serif);
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 6px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .step-head p {
    font-size: var(--text-sm);
    color: var(--ink-3);
    margin: 0;
  }

  /* 步骤1 — 类型列表 */
  .type-list { display: flex; flex-direction: column; gap: 8px; }
  .type-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    cursor: pointer;
    transition: all var(--dur) var(--ease);
  }
  .type-row:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
  }
  .type-row input { display: none; }
  .type-row .ic {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .type-row .ic svg { width: 20px; height: 20px; }
  .type-row .txt { flex: 1; min-width: 0; }
  .type-row .n { font-size: var(--text-md); font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .type-row .d { font-size: 12.5px; color: var(--ink-3); }
  .type-row .chev {
    color: var(--ink-4);
    transition: transform var(--dur) var(--ease);
  }
  .type-row:hover .chev { transform: translateX(3px); color: var(--brand); }

  .ic.i-inaccurate { background: var(--purple-soft); color: oklch(0.48 0.14 300); }
  .ic.i-bug { background: var(--danger-soft); color: var(--danger); }
  .ic.i-suggest { background: var(--success-soft); color: oklch(0.45 0.12 155); }
  .ic.i-demand { background: var(--warn-soft); color: oklch(0.48 0.13 75); }
  .ic.i-other { background: var(--surface-2); color: var(--ink-3); }

  .space-strip {
    margin-top: 24px;
    padding: 14px 16px;
    background: var(--surface-2);
    border: 1px dashed var(--border);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .space-strip .lbl {
    font-size: var(--text-xs);
    color: var(--ink-3);
  }
  .space-strip .opts { display: flex; gap: 6px; margin-left: auto; }
  .space-strip .opt {
    padding: 4px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
  }
  .space-strip .opt.active {
    background: var(--ink);
    color: var(--surface);
    border-color: var(--ink);
  }

  /* 步骤2 — 描述 */
  .type-indicator {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px 5px 5px;
    background: var(--brand-soft);
    border-radius: 999px;
    font-size: 12px;
    color: var(--brand-ink);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .type-indicator .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; color: #fff; }
  .type-indicator .dot svg { width: 10px; height: 10px; }

  .desc-box {
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    transition: all var(--dur) var(--ease);
    background: var(--surface);
  }
  .desc-box:focus-within {
    border-color: var(--brand);
    box-shadow: var(--focus-ring);
  }
  .desc-box textarea {
    width: 100%;
    min-height: 160px;
    padding: 18px;
    border: 0;
    outline: 0;
    resize: none;
    font-family: inherit;
    font-size: var(--text-md);
    line-height: 1.65;
    color: var(--ink);
    background: transparent;
  }
  .desc-box textarea::placeholder { color: var(--ink-4); }
  .desc-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-top: 1px solid var(--divider);
    background: var(--surface-2);
  }
  .desc-tools .tools { display: flex; gap: 6px; }
  .tool-btn {
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--ink-2);
    cursor: pointer;
    display: flex; align-items: center; gap: 4px;
  }
  .tool-btn:hover { background: var(--surface-hover); color: var(--ink); }
  .counter {
    font-size: 11.5px;
    color: var(--ink-4);
    font-variant-numeric: tabular-nums;
  }
  .counter.warn { color: var(--danger); }

  /* 模板短语 */
  .template-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .template-chips .chip {
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11.5px;
    color: var(--ink-3);
    cursor: pointer;
  }
  .template-chips .chip:hover { background: var(--brand-soft); color: var(--brand-ink); border-color: var(--brand-soft); }

  .uploader {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .drop-zone {
    aspect-ratio: 1;
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--r-md);
    background: var(--surface-2);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    cursor: pointer;
    color: var(--ink-3);
    font-size: 10.5px;
    transition: all var(--dur) var(--ease);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--brand);
    background: var(--brand-soft);
    color: var(--brand-ink);
  }
  .drop-zone svg { width: 18px; height: 18px; }
  .thumb {
    aspect-ratio: 1;
    position: relative;
    border-radius: var(--r-md);
    overflow: hidden;
    border: 1px solid var(--border);
    animation: pop 240ms var(--ease-out);
  }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .x {
    position: absolute; top: 4px; right: 4px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: oklch(0.2 0.01 60 / 0.7);
    color: #fff; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }

  /* 步骤3 — 联系方式 / 确认 */
  .contact-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--surface);
    font-size: var(--text-md);
    color: var(--ink);
    font-family: inherit;
    transition: all var(--dur) var(--ease);
  }
  .contact-input:focus { outline: 0; border-color: var(--brand); box-shadow: var(--focus-ring); }

  .review-card {
    margin-top: 20px;
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    background: var(--surface-2);
  }
  .review-card .head {
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--divider);
    font-size: 11.5px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .review-card .body { padding: 6px 0; }
  .review-card .rrow {
    display: flex;
    padding: 10px 14px;
    gap: 14px;
    font-size: 13px;
  }
  .review-card .rk {
    width: 70px;
    color: var(--ink-3);
    flex-shrink: 0;
  }
  .review-card .rv {
    color: var(--ink);
    flex: 1;
    word-break: break-word;
  }

  /* 底部导航 */
  .nav-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px max(14px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--divider);
    background: var(--surface);
  }
  .nav-bar .btn-primary { flex: 1; }
  .nav-bar .btn-ghost { padding-inline: 18px; }
  .btn {
    padding: 12px 16px;
    font-size: var(--text-md);
    font-weight: 600;
  }

  /* 成功态 */
  .success {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    flex: 1;
  }
  .success.show { display: flex; animation: fade 300ms ease; }
  @keyframes fade { from { opacity: 0; } }
  .success .halo {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle, oklch(0.96 0.05 155), oklch(0.9 0.1 155));
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px;
    position: relative;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .success .halo svg {
    width: 48px; height: 48px; color: oklch(0.42 0.15 155);
    stroke-dasharray: 48; stroke-dashoffset: 48;
    animation: draw 600ms 200ms ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .success h2 {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .success p {
    font-size: var(--text-sm);
    color: var(--ink-3);
    margin: 0 0 22px;
    max-width: 30ch;
  }
  .success .ticket {
    display: inline-flex;
    padding: 10px 18px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-2);
    margin-bottom: 24px;
    gap: 8px;
  }
  .success .acts { display: flex; gap: 8px; width: 100%; max-width: 300px; }
  .success .acts .btn { flex: 1; }

  /* Tweaks */
  .tweaks {
    position: fixed; right: 16px; bottom: 16px; width: 260px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); box-shadow: var(--shadow-xl);
    padding: 14px; z-index: 300; font-size: 12px;
    transition: all 220ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .tweaks.collapsed { width: 44px; height: 44px; padding: 0; border-radius: 50%; overflow: hidden; cursor: pointer; }
  .tweaks.collapsed > *:not(.tweaks-toggle) { display: none !important; }
  .tweaks-toggle { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; border-radius: 6px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .tweaks-toggle:hover { background: var(--surface-2); color: var(--ink); }
  .tweaks-toggle svg { width: 14px; height: 14px; }
  .tweaks.collapsed .tweaks-toggle { position: static; width: 100%; height: 100%; border-radius: 50%; background: var(--ink); color: var(--surface); }
  .tweaks.collapsed .tweaks-toggle:hover { background: var(--brand); }
  .tweaks.collapsed .tweaks-toggle svg { width: 18px; height: 18px; }
  .tweaks h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; padding-right: 24px; }
  .tweaks .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .tweaks .swatch-row { display: flex; gap: 6px; }
  .tweaks .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer; }
  .tweaks .sw.active { box-shadow: 0 0 0 2px var(--ink); }
  .tweaks select { font-size: 12px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translate(-50%, -12px);
    background: var(--ink); color: oklch(0.96 0.005 75);
    padding: 10px 16px; border-radius: 10px; font-size: 13px;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: all var(--dur) var(--ease);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="返回">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="title">反馈</div>
    <div class="step-pill" id="stepPill">1 / 3</div>
  </div>
  <div class="progress"><div class="bar" id="progressBar" style="width: 33%"></div></div>

  <div class="stage" id="stage">

    <!-- STEP 1 -->
    <div class="step active" data-step="1">
      <div class="step-head">
        <div class="kicker">Step 01</div>
        <h2>你想反馈什么？</h2>
        <p>先选择最贴近你情况的类型，我们会把它路由给正确的同事。</p>
      </div>

      <div class="type-list">
        <label class="type-row" data-type="输出不准确">
          <input type="radio" name="type" value="输出不准确" />
          <span class="ic i-inaccurate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6"/><path d="m15 9-6 6"/></svg>
          </span>
          <div class="txt"><div class="n">输出不准确</div><div class="d">回答错误、生成结果偏差</div></div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </label>
        <label class="type-row" data-type="BUG">
          <input type="radio" name="type" value="BUG" />
          <span class="ic i-bug">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"/><path d="M12 11v9"/><path d="m8 2 2 2"/><path d="m14 4 2-2"/></svg>
          </span>
          <div class="txt"><div class="n">BUG</div><div class="d">页面崩溃、功能失效、报错</div></div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </label>
        <label class="type-row" data-type="体验建议">
          <input type="radio" name="type" value="体验建议" />
          <span class="ic i-suggest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15 14c.2-1 .7-1.7 1.4-2.5A4.7 4.7 0 0 0 18 8a6 6 0 1 0-12 0c0 1.5.4 2.5 1.5 3.5.8.8 1.2 1.5 1.5 2.5"/></svg>
          </span>
          <div class="txt"><div class="n">体验建议</div><div class="d">流程、交互可以更好</div></div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </label>
        <label class="type-row" data-type="需求">
          <input type="radio" name="type" value="需求" />
          <span class="ic i-demand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10"/><path d="M7 12h8"/><path d="M7 16h6"/></svg>
          </span>
          <div class="txt"><div class="n">新需求</div><div class="d">希望新增的能力</div></div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </label>
        <label class="type-row" data-type="其他">
          <input type="radio" name="type" value="其他" />
          <span class="ic i-other">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="16" cy="12" r="1"/></svg>
          </span>
          <div class="txt"><div class="n">其他</div><div class="d">不属于以上类别</div></div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
        </label>
      </div>

      <div class="space-strip">
        <span class="lbl">所属空间</span>
        <div class="opts">
          <span class="opt" data-space="灵珠虾">灵珠虾</span>
          <span class="opt" data-space="魔丸虾">魔丸虾</span>
        </div>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step" data-step="2">
      <div class="step-head">
        <div class="kicker">Step 02</div>
        <h2>详细说说是怎么回事</h2>
        <p>描述越具体越好，可以贴截图。</p>
      </div>
      <div id="typeIndicator" class="type-indicator">
        <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
        <span id="typeIndicatorText">BUG</span>
      </div>

      <div class="desc-box">
        <textarea id="desc" maxlength="500" placeholder="比如：在魔丸虾空间的「生成」功能里，点击按钮之后页面没有任何反应，刷新后恢复。复现路径：…"></textarea>
        <div class="desc-tools">
          <div class="tools">
            <button type="button" class="tool-btn" id="pickBtn">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
              图片
            </button>
            <button type="button" class="tool-btn">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
              粘贴
            </button>
          </div>
          <span class="counter" id="counter">0 / 500</span>
        </div>
      </div>

      <div class="template-chips" id="templates"></div>

      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <div class="uploader" id="uploader">
        <div class="drop-zone" id="dropZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span>添加图片</span>
        </div>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step" data-step="3">
      <div class="step-head">
        <div class="kicker">Step 03</div>
        <h2>最后一步</h2>
        <p>留下联系方式，方便我们跟你同步进展。可选。</p>
      </div>
      <input type="text" class="contact-input" id="contact" placeholder="手机号 / 微信号 / 邮箱" />

      <div class="review-card">
        <div class="head">提交预览</div>
        <div class="body" id="reviewBody"></div>
      </div>
    </div>

    <!-- SUCCESS -->
    <div class="success" id="success">
      <div class="halo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2>感谢你的反馈</h2>
      <p>我们已经收到了，产品团队会在 24 小时内响应。</p>
      <div class="ticket">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        反馈编号 <strong id="ticketNum">#FB-0001</strong>
      </div>
      <div class="acts">
        <button class="btn btn-ghost" onclick="location.reload()">再写一条</button>
        <button class="btn btn-primary" onclick="location.reload()">完成</button>
      </div>
    </div>
  </div>

  <div class="nav-bar" id="navBar">
    <button class="btn btn-ghost" id="prevBtn" style="display:none">上一步</button>
    <button class="btn btn-primary" id="nextBtn" disabled>下一步
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Tweaks -->
<div class="tweaks" id="tweaks">
  <button class="tweaks-toggle" id="tweaksToggle" title="展开 / 收起" aria-label="切换 Tweaks 面板">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <h4>Tweaks · 设计微调</h4>
  <div class="row">
    <span>主色</span>
    <div class="swatch-row" id="brandSwatches">
      <span class="sw active" data-brand="42" style="background:oklch(0.62 0.14 42)"></span>
      <span class="sw" data-brand="25" style="background:oklch(0.62 0.16 25)"></span>
      <span class="sw" data-brand="155" style="background:oklch(0.58 0.11 155)"></span>
      <span class="sw" data-brand="240" style="background:oklch(0.58 0.11 240)"></span>
      <span class="sw" data-brand="300" style="background:oklch(0.58 0.12 300)"></span>
    </div>
  </div>
  <div class="row"><span>字体</span>
    <select id="fontSel">
      <option value="sans">Inter + 苹方</option>
      <option value="serif">Source Serif + 苹方</option>
      <option value="system">系统栈</option>
    </select>
  </div>
  <div class="row"><span>密度</span>
    <select id="densitySel">
      <option value="cozy">舒适</option>
      <option value="compact">紧凑</option>
    </select>
  </div>
</div>

<script>
  const state = { step: 1, type: null, space: null, desc: '', contact: '', files: [] };

  const TEMPLATES = {
    '输出不准确': ['和我预期不一致', '事实有误', '部分内容重复'],
    'BUG': ['必现 ·', '偶现 ·', '复现路径：1.', '设备：iPhone /'],
    '体验建议': ['建议把…', '希望可以…', '如果能…会更好'],
    '需求': ['我希望新增…', '业务场景：', '参考：'],
    '其他': []
  };

  const steps = document.querySelectorAll('.step');
  const progressBar = document.getElementById('progressBar');
  const stepPill = document.getElementById('stepPill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const backBtn = document.getElementById('backBtn');

  function go(n) {
    if (n === 4) return submit();
    if (n < 1) return;
    const prev = state.step; state.step = n;
    steps.forEach(s => {
      const v = Number(s.dataset.step);
      s.classList.remove('active','prev');
      if (v === n) s.classList.add('active');
      else if (v < n) s.classList.add('prev');
    });
    progressBar.style.width = (n/3)*100 + '%';
    stepPill.textContent = `${n} / 3`;
    prevBtn.style.display = n === 1 ? 'none' : 'inline-flex';
    if (n === 3) renderReview();
    nextBtn.innerHTML = n === 3 ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg> 提交反馈' : '下一步 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
    validate();
  }
  backBtn.onclick = prevBtn.onclick = () => go(state.step - 1);
  nextBtn.onclick = () => go(state.step + 1);

  // ---- Step1: type + space ----
  document.querySelectorAll('.type-row').forEach(r => {
    r.onclick = () => {
      document.querySelectorAll('.type-row').forEach(x => x.style.borderColor = '');
      r.style.borderColor = 'var(--brand)';
      r.style.background = 'var(--brand-soft)';
      document.querySelectorAll('.type-row').forEach(x => { if (x !== r) x.style.background = ''; });
      state.type = r.dataset.type;
      validate();
      setTimeout(() => go(2), 250);
    };
  });
  document.querySelectorAll('.space-strip .opt').forEach(o => {
    o.onclick = () => {
      document.querySelectorAll('.space-strip .opt').forEach(x => x.classList.remove('active'));
      o.classList.add('active');
      state.space = o.dataset.space;
    };
  });

  // ---- Step2: desc ----
  const desc = document.getElementById('desc');
  const counter = document.getElementById('counter');
  desc.addEventListener('input', () => {
    state.desc = desc.value;
    const n = desc.value.length;
    counter.textContent = `${n} / 500`;
    counter.classList.toggle('warn', n >= 450);
    validate();
  });
  function renderTemplates() {
    const box = document.getElementById('templates');
    box.innerHTML = '';
    (TEMPLATES[state.type] || []).forEach(t => {
      const c = document.createElement('span');
      c.className = 'chip'; c.textContent = t;
      c.onclick = () => { desc.value += (desc.value ? ' ' : '') + t; desc.dispatchEvent(new Event('input')); desc.focus(); };
      box.appendChild(c);
    });
    document.getElementById('typeIndicatorText').textContent = state.type || '';
  }

  // ---- 图片上传 ----
  const uploader = document.getElementById('uploader');
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  document.getElementById('pickBtn').onclick = () => fileInput.click();
  dropZone.onclick = () => fileInput.click();
  fileInput.onchange = e => { handleFiles(e.target.files); fileInput.value = ''; };
  ['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
  dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  desc.addEventListener('paste', e => {
    for (const it of (e.clipboardData?.items || [])) {
      if (it.type.startsWith('image/')) {
        const f = it.getAsFile();
        handleFiles([new File([f], `pasted_${Date.now()}.png`, { type: f.type })]);
        e.preventDefault();
        toast('已添加粘贴的图片');
      }
    }
  });
  function handleFiles(list) {
    for (const f of list) {
      if (!f.type.startsWith('image/')) continue;
      if (state.files.length >= 3) { toast('最多 3 张'); break; }
      if (f.size > 10*1024*1024) { toast('不超过 10MB'); continue; }
      state.files.push(f);
    }
    renderThumbs();
  }
  function renderThumbs() {
    uploader.querySelectorAll('.thumb').forEach(n => n.remove());
    state.files.forEach((f, i) => {
      const r = new FileReader();
      r.onload = e => {
        const d = document.createElement('div');
        d.className = 'thumb';
        d.innerHTML = `<img src="${e.target.result}"/><button class="x" type="button">×</button>`;
        d.querySelector('.x').onclick = () => { state.files.splice(i,1); renderThumbs(); };
        uploader.insertBefore(d, dropZone);
      };
      r.readAsDataURL(f);
    });
    dropZone.style.display = state.files.length >= 3 ? 'none' : 'flex';
  }

  // ---- Step3 ----
  document.getElementById('contact').oninput = e => state.contact = e.target.value;
  function renderReview() {
    const body = document.getElementById('reviewBody');
    const rows = [
      ['类型', state.type || '—'],
      ['空间', state.space || '—'],
      ['描述', state.desc.slice(0, 120) + (state.desc.length > 120 ? '…' : '') || '—'],
      ['图片', state.files.length ? `${state.files.length} 张` : '无'],
      ['联系方式', state.contact || '—']
    ];
    body.innerHTML = rows.map(([k,v]) =>
      `<div class="rrow"><div class="rk">${k}</div><div class="rv">${v}</div></div>`
    ).join('');
  }

  function validate() {
    if (state.step === 1) nextBtn.disabled = !state.type;
    else if (state.step === 2) nextBtn.disabled = !state.desc.trim();
    else nextBtn.disabled = false;
    if (state.step === 2) renderTemplates();
  }

  function submit() {
    document.getElementById('navBar').style.display = 'none';
    steps.forEach(s => s.classList.remove('active'));
    document.getElementById('ticketNum').textContent = '#FB-' + String(Math.floor(Math.random()*9000)+1000);
    document.getElementById('success').classList.add('show');
    progressBar.style.width = '100%';
    stepPill.textContent = '完成';
  }

  // ---- Toast ----
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ---- Tweaks ----
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "brandHue": 42,
    "font": "sans",
    "density": "cozy"
  }/*EDITMODE-END*/;
  const tw = {...TWEAK_DEFAULTS};
  function applyTweaks() {
    const r = document.documentElement;
    r.style.setProperty('--brand', `oklch(0.62 0.14 ${tw.brandHue})`);
    r.style.setProperty('--brand-hover', `oklch(0.56 0.15 ${tw.brandHue})`);
    r.style.setProperty('--brand-soft', `oklch(0.96 0.03 ${tw.brandHue})`);
    r.style.setProperty('--brand-ink', `oklch(0.42 0.13 ${tw.brandHue})`);
    if (tw.font === 'serif') document.body.style.fontFamily = 'var(--font-serif)';
    else if (tw.font === 'system') document.body.style.fontFamily = '-apple-system, sans-serif';
    else document.body.style.fontFamily = 'var(--font-sans)';
  }
  applyTweaks();

  window.addEventListener('message', e => {
    if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks').classList.remove('collapsed');
    if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.add('collapsed');
  });
  window.parent.postMessage({type:'__edit_mode_available'}, '*');
  (function() {
    const panel = document.getElementById('tweaks');
    const btn = document.getElementById('tweaksToggle');
    const KEY = 'tweaks_collapsed_v1';
    if (localStorage.getItem(KEY) === '1') panel.classList.add('collapsed');
    btn.addEventListener('click', (e) => { e.stopPropagation(); panel.classList.toggle('collapsed'); localStorage.setItem(KEY, panel.classList.contains('collapsed') ? '1' : '0'); });
    panel.addEventListener('click', () => { if (panel.classList.contains('collapsed')) { panel.classList.remove('collapsed'); localStorage.setItem(KEY, '0'); } });
  })();
  document.querySelectorAll('#brandSwatches .sw').forEach(sw => sw.onclick = () => {
    document.querySelectorAll('#brandSwatches .sw').forEach(x => x.classList.remove('active'));
    sw.classList.add('active'); tw.brandHue = +sw.dataset.brand; applyTweaks();
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{brandHue: tw.brandHue}}, '*');
  });
  document.getElementById('fontSel').value = tw.font;
  document.getElementById('fontSel').onchange = e => { tw.font = e.target.value; applyTweaks();
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{font: tw.font}}, '*'); };
  document.getElementById('densitySel').value = tw.density;
</script>
</body>
</html>
